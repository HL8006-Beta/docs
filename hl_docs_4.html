                const cleanUrl = DEFAULT_APPS_SCRIPT_URL;

                if (cleanUser.length < 3 || cleanPass.length < 4) {
                    setAuthError('Username must be at least 3 characters and password at least 4 characters.');
                    return;
                }

                setAuthBusy(true);

                try {
                    const res = await fetch(cleanUrl, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: authMode === 'register' ? 'register_account' : 'login_account',
                            username: cleanUser,
                            password: cleanPass,
                            displayName: loginDisplay.trim() || cleanUser
                        })
                    });
                    const text = await res.text();
                    let json = null;
                    try { json = JSON.parse(text); } catch (err) {}

                    if (json && json.success) {
                        // Carry over any documents created while unsigned-in so nothing is lost
                        const guestDocs = safeStorageGet('hl8006_docs_2000_docs_guest', []);
                        const userDocsKey = `hl8006_docs_2000_docs_${(json.username || cleanUser).toLowerCase()}`;
                        const existingUserDocs = safeStorageGet(userDocsKey, []);
                        if (Array.isArray(guestDocs) && guestDocs.length > 0 && existingUserDocs.length === 0) {
                            safeStorageSet(userDocsKey, guestDocs);
                        }

                        const sess = {
                            username: json.username || cleanUser,
                            displayName: json.displayName || loginDisplay.trim() || cleanUser,
                            role: json.role || 'User',
                            token: json.token,
                            loggedInAt: Date.now()
                        };
                        safeStorageSet('hl8006_docs_user_session', sess);
                        setAuthSession(sess);
                        setLoginPass('');
                        setShowAuthModal(false);
                        notify(`Signed in as ${sess.displayName}. Cloud backup enabled.`);
                    } else if (json && json.error) {
                        setAuthError(json.error);
                    } else {
                        setAuthError(
                            authMode === 'login'
                                ? 'Sign in failed. Make sure you have created an account first, and that your Apps Script Web App is deployed with access set to "Anyone".'
                                : 'Account creation failed. Verify your Apps Script Web App is deployed as "Anyone" with the latest version.'
                        );
                    }
                } catch (err) {
                    setAuthError('Could not connect to the cloud server. Check your internet connection and Apps Script deployment.');
                } finally {
                    setAuthBusy(false);
                }
            };

            const handleSignOut = async () => {
                if (Object.keys(dirtyRef.current).length > 0 && onlineRef.current && scriptUrl && authSession) {
                    await pushDirtyDocsToCloud(false);
                }
                localStorage.removeItem('hl8006_docs_user_session');
                setAuthSession(null);
                setSyncStatus('idle');
                notify('Signed out. Local documents remain available on this device.');
            };

            // ------------------------------------------
            // 5. EDITOR TIMERS, STATS & COMMANDS
            // ------------------------------------------
            useEffect(() => {
                const iv = setInterval(() => setSessionMinutes(m => m + 1), 60000);
                return () => clearInterval(iv);
            }, []);

            useEffect(() => {
                if (!isAutoScrolling || !scrollRef.current) return;
                const iv = setInterval(() => {
                    if (scrollRef.current) scrollRef.current.scrollTop += 1;
                }, 32);
                return () => clearInterval(iv);
            }, [isAutoScrolling]);

            const updateStats = useCallback((plainText) => {
                const text = String(plainText || '');
                const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
                setWordCount(words);
                setCharCount(text.length);
                const sentences = Math.max(1, text.split(/[.!?]+/).filter(Boolean).length);
                const avg = words / sentences;
                setReadability(avg > 20 ? 'Advanced' : avg > 12 ? 'Medium' : 'Easy');
            }, []);

            const parseHeadings = useCallback(() => {
                if (!editorRef.current) return;
                const els = editorRef.current.querySelectorAll('h1, h2, h3, h4');
                setDocumentHeadings(Array.from(els).map((el, idx) => ({
                    id: idx,
                    text: (el.innerText || 'Untitled Heading').trim(),
                    level: parseInt(el.tagName.substring(1), 10) || 1,
                    elem: el
                })));
            }, []);

            const checkActiveFormats = useCallback(() => {
                if (!editorRef.current) return;
                try {
                    setActiveFormats({
                        bold: document.queryCommandState('bold'),
                        italic: document.queryCommandState('italic'),
                        underline: document.queryCommandState('underline'),
                        strikeThrough: document.queryCommandState('strikeThrough'),
                        justifyLeft: document.queryCommandState('justifyLeft'),
                        justifyCenter: document.queryCommandState('justifyCenter'),
                        justifyRight: document.queryCommandState('justifyRight'),
                        justifyFull: document.queryCommandState('justifyFull'),
                        insertUnorderedList: document.queryCommandState('insertUnorderedList'),
                        insertOrderedList: document.queryCommandState('insertOrderedList'),
                        subscript: document.queryCommandState('subscript'),
                        superscript: document.queryCommandState('superscript')
                    });
                    const fn = document.queryCommandValue('fontName');
                    if (fn) setCurrentFontName(fn.replace(/['"]/g, '').split(',')[0].trim());
                } catch (e) {}
            }, []);

            const restoreSelection = () => {
                if (savedRangeRef.current && window.getSelection) {
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(savedRangeRef.current);
                }
            };

            // Calculate exact whole-page count (e.g., 1.5 pages of content -> 2 full pages)
            const recalcPages = useCallback(() => {
                const metrics = getPaperMetrics(advancedSettings.paperMode);
                if (!metrics.paged || !editorRef.current) {
                    setPageCount(1);
                    return;
                }
                const padPx = parseInt(getMarginPx(advancedSettings.pageMargins), 10) || 48;
                const naturalContentHeight = editorRef.current.scrollHeight + (padPx * 2);
                const wholePages = Math.max(1, Math.ceil(naturalContentHeight / metrics.height));
                setPageCount(wholePages);
            }, [advancedSettings.paperMode, advancedSettings.pageMargins]);

            // Update floating corner resize handle position for selected image
            const updateImageHandlePosition = useCallback((imgEl) => {
                const target = imgEl || activeImage;
                if (!target || !paperRef.current || !editorRef.current || !editorRef.current.contains(target)) {
                    setImageHandleBox(null);
                    return;
                }
                const paperRect = paperRef.current.getBoundingClientRect();
                const imgRect = target.getBoundingClientRect();
                const scale = zoomLevel / 100;
                setImageHandleBox({
                    left: (imgRect.left - paperRect.left) / scale,
                    top: (imgRect.top - paperRect.top) / scale,
                    width: imgRect.width / scale,
                    height: imgRect.height / scale
                });
            }, [activeImage, zoomLevel]);

            const handleContentChange = useCallback(() => {
                if (!editorRef.current || readOnly || !currentDocId) return;
                // Ensure all images in the editor are draggable for text-reflow positioning
                editorRef.current.querySelectorAll('img').forEach(img => {
                    if (img.getAttribute('draggable') !== 'true') img.setAttribute('draggable', 'true');
                });
                const html = editorRef.current.innerHTML;
                const plain = editorRef.current.innerText || '';
                const snippet = plain.replace(/\s+/g, ' ').trim().slice(0, 140);

                updateStats(plain);
                parseHeadings();
                checkActiveFormats();
                recalcPages();
                if (activeImage) updateImageHandlePosition(activeImage);
                setSaveIndicator('Saving...');

                setDocuments(prev => prev.map(d =>
                    d.id === currentDocId
                        ? { ...d, content: html, snippet, lastModified: Date.now() }
                        : d
                ));
                markDocDirty(currentDocId);
                setTimeout(() => setSaveIndicator('Saved'), 220);
            }, [currentDocId, readOnly, updateStats, parseHeadings, checkActiveFormats, recalcPages, activeImage, updateImageHandlePosition, markDocDirty]);

            // Keyboard shortcuts (Ctrl+S, Ctrl+F, Esc exits Focus Mode)
            useEffect(() => {
                const onKey = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                        e.preventDefault();
                        if (currentView === 'editor') {
                            handleContentChange();
                            if (onlineRef.current && urlRef.current && authRef.current) {
                                pushDirtyDocsToCloud(false);
                                notify('Saved & backing up to cloud...');
                            } else {
                                notify('Saved to device.');
                            }
                        }
                    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f' && currentView === 'editor') {
                        e.preventDefault();
                        setShowFindReplace(true);
                    } else if (e.key === 'Escape' && focusMode) {
                        setFocusMode(false);
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [currentView, focusMode, handleContentChange, pushDirtyDocsToCloud, notify]);

            // Hydrate editor when switching doc or view
            useEffect(() => {
                if (currentView === 'editor' && editorRef.current && currentDoc) {
                    if (editorRef.current.innerHTML !== currentDoc.content) {
                        editorRef.current.innerHTML = currentDoc.content || '';
                    }
                    editorRef.current.querySelectorAll('img').forEach(img => img.setAttribute('draggable', 'true'));
                    updateStats(editorRef.current.innerText || '');
                    parseHeadings();
                    checkActiveFormats();
                    setTimeout(recalcPages, 30);
                    setActiveImage(null);
                    setImageHandleBox(null);
                    setActiveCell(null);
                    setIsAutoScrolling(false);
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                    setIsSpeaking(false);
                }
            }, [currentDocId, currentView, recalcPages]);

            // Recalculate full pages when paper format or margins change
            useEffect(() => {
                if (currentView === 'editor') {
                    const t = setTimeout(recalcPages, 40);
                    return () => clearTimeout(t);
                }
            }, [currentView, advancedSettings.paperMode, advancedSettings.pageMargins, recalcPages]);

            // Keep image resize handle aligned on zoom/resize
            useEffect(() => {
                if (activeImage) updateImageHandlePosition(activeImage);
                else setImageHandleBox(null);
            }, [activeImage, zoomLevel, updateImageHandlePosition]);

            // Interactive mouse drag on corner resize handle
            const startImageCornerResize = (e) => {
                if (!activeImage || readOnly) return;
                e.preventDefault();
                e.stopPropagation();
                const startX = e.clientX;
                const rect = activeImage.getBoundingClientRect();
                const scale = zoomLevel / 100;
                const startWidth = rect.width / scale;
                resizingImgRef.current = { startX, startWidth, scale };

                const onMouseMove = (moveEv) => {
                    if (!resizingImgRef.current || !activeImage) return;
                    const dx = (moveEv.clientX - resizingImgRef.current.startX) / resizingImgRef.current.scale;
                    const newW = Math.max(40, Math.min(760, Math.round(resizingImgRef.current.startWidth + dx)));
                    activeImage.style.width = `${newW}px`;
                    activeImage.style.height = 'auto';
                    updateImageHandlePosition(activeImage);
                };

                const onMouseUp = () => {
                    resizingImgRef.current = null;
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                    handleContentChange();
                };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            };

            // Track selection stats & save range for toolbar commands
            useEffect(() => {
                const onSelChange = () => {
                    if (currentView !== 'editor' || !editorRef.current) return;
                    const sel = window.getSelection();
                    if (sel && sel.rangeCount > 0) {
                        const range = sel.getRangeAt(0);
                        if (editorRef.current.contains(range.commonAncestorContainer)) {
                            savedRangeRef.current = range.cloneRange();
                            const text = sel.toString();
                            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
                            setSelectionStats({ words, chars: text.length });

                            let node = sel.focusNode;
                            if (node && node.nodeType === 3) node = node.parentNode;
                            if (node && node.nodeType === 1) {
                                const sz = parseInt(window.getComputedStyle(node).fontSize, 10);
                                if (!isNaN(sz)) setCurrentFontSize(String(sz));
                            }
                            checkActiveFormats();
                        }
                    } else {
                        setSelectionStats({ words: 0, chars: 0 });
                    }
                };
                document.addEventListener('selectionchange', onSelChange);
                return () => document.removeEventListener('selectionchange', onSelChange);
            }, [currentView, checkActiveFormats]);

            const executeCommand = (cmd, value = null) => {
                if (readOnly) return;
                if (editorRef.current) editorRef.current.focus();
                restoreSelection();
                try { document.execCommand(cmd, false, value); } catch (e) {}
                handleContentChange();
                setActiveMenu(null);
            };

            const handleFontSizeChange = (sizePx) => {
                if (readOnly) return;
                if (editorRef.current) editorRef.current.focus();
                restoreSelection();
                document.execCommand('fontSize', false, '7');
                if (editorRef.current) {
                    editorRef.current.querySelectorAll('font[size="7"]').forEach(f => {
                        f.removeAttribute('size');
                        f.style.fontSize = `${sizePx}px`;
                    });
                }
                setCurrentFontSize(String(sizePx));
                handleContentChange();
                setActiveMenu(null);
            };

            const changeLineSpacing = (spacing) => {
                if (readOnly || !editorRef.current) return;
                editorRef.current.focus();
                restoreSelection();
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0) {
                    let node = sel.focusNode;
                    while (node && node !== editorRef.current && node.nodeType !== 1) node = node.parentNode;
                    if (node && node.style) node.style.lineHeight = spacing;
                } else {
                    editorRef.current.style.lineHeight = spacing;
                }
                handleContentChange();
                setActiveMenu(null);
            };

            const transformCase = (mode) => {
                if (readOnly) return;
                if (editorRef.current) editorRef.current.focus();
                restoreSelection();
                const sel = window.getSelection();
                if (!sel || !sel.rangeCount) return;
                const txt = sel.toString();
                if (!txt) {
                    notify('Select text first to change its case.');
                    setActiveMenu(null);
                    return;
                }
                let next = txt;
                if (mode === 'upper') next = txt.toUpperCase();
                if (mode === 'lower') next = txt.toLowerCase();
                if (mode === 'title') next = txt.toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase());
                document.execCommand('insertText', false, next);
                handleContentChange();
                setActiveMenu(null);
            };

            // ------------------------------------------
            // 6. DOCUMENT CRUD, SNAPSHOTS & COMMENTS
            // ------------------------------------------
            const createNewDocument = (template = null) => {
                const tpl = template || DOC_TEMPLATES[0];
                const newId = 'doc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5);
                const newDoc = {
                    id: newId,
                    title: tpl.id === 'blank' ? 'Untitled Document' : tpl.name,
                    content: `<div style="font-family: '${defaultSettings.font}'; font-size: ${defaultSettings.size}px; line-height: 1.5;">${tpl.html}</div>`,
                    snippet: tpl.desc || '',
                    tags: tpl.tags || '',
                    pinned: false,
                    comments: [],
                    snapshots: [],
                    lastModified: Date.now()
                };
                setDocuments(prev => [newDoc, ...prev]);
                markDocDirty(newId);
                setCurrentDocId(newId);
                setCurrentView('editor');
                setActiveMenu(null);
                setShowTemplateDialog(false);
                notify(`Created "${newDoc.title}".`);
            };

            const openDocument = (id) => {
                setCurrentDocId(id);
                setCurrentView('editor');
            };

            const updateDocMeta = (field, value) => {
                if (!currentDocId) return;
                setDocuments(prev => prev.map(d =>
                    d.id === currentDocId ? { ...d, [field]: value, lastModified: Date.now() } : d
                ));
                markDocDirty(currentDocId);
            };

            const saveVersionSnapshot = () => {
                if (!currentDoc || !editorRef.current) return;
                const snap = {
                    id: 'snap_' + Date.now(),
                    timestamp: Date.now(),
                    title: currentDoc.title,
                    wordCount,
                    content: editorRef.current.innerHTML
                };
                setDocuments(prev => prev.map(d =>
                    d.id === currentDocId
                        ? { ...d, snapshots: [snap, ...(Array.isArray(d.snapshots) ? d.snapshots : [])].slice(0, 20) }
                        : d
                ));
                notify('Saved version snapshot.');
            };

            const restoreSnapshot = (snap) => {
                if (!snap || !editorRef.current) return;
                editorRef.current.innerHTML = snap.content;
                handleContentChange();
                setShowHistoryDialog(false);
                notify(`Restored snapshot from ${new Date(snap.timestamp).toLocaleTimeString()}.`);
            };

            const addComment = (e) => {
                e.preventDefault();
                const text = newCommentText.trim();
                if (!text || !currentDocId) return;
                const note = {
                    id: 'c_' + Date.now(),
                    author: (authSession && (authSession.displayName || authSession.username)) || 'User',
                    text,
                    createdAt: Date.now()
                };
                setDocuments(prev => prev.map(d =>
                    d.id === currentDocId
                        ? { ...d, comments: [note, ...(Array.isArray(d.comments) ? d.comments : [])], lastModified: Date.now() }
                        : d
                ));
                markDocDirty(currentDocId);
                setNewCommentText('');
            };

            const deleteComment = (commentId) => {
                setDocuments(prev => prev.map(d =>
                    d.id === currentDocId
                        ? { ...d, comments: (d.comments || []).filter(c => c.id !== commentId), lastModified: Date.now() }
                        : d
                ));
                markDocDirty(currentDocId);
            };

            const togglePin = (id, e) => {
                if (e) e.stopPropagation();
                setDocuments(prev => prev.map(d => d.id === id ? { ...d, pinned: !d.pinned, lastModified: Date.now() } : d));
                markDocDirty(id);
            };

            const duplicateDocument = (doc, e) => {
                if (e) e.stopPropagation();
                const copyId = 'doc_' + Date.now();
                const copy = {
                    ...doc,
                    id: copyId,
                    title: `${doc.title || 'Untitled'} (Copy)`,
                    pinned: false,
                    lastModified: Date.now()
                };
                setDocuments(prev => [copy, ...prev]);
                markDocDirty(copyId);
                notify(`Duplicated "${doc.title}".`);
            };

            const confirmDeleteDoc = () => {
                if (!docToDelete) return;
                const target = documents.find(d => d.id === docToDelete);
                if (target) {
                    setDeletedDocuments(prev => [{ ...target, deletedAt: Date.now(), trashed: true }, ...prev]);
                    const remaining = documents.filter(d => d.id !== docToDelete);
                    setDocuments(remaining);
                    markDocDirty(docToDelete);
                    if (currentDocId === docToDelete) {
                        setCurrentDocId(remaining[0] ? remaining[0].id : null);
                        setCurrentView('home');
                    }
                    notify(`Moved "${target.title}" to Recycle Bin.`);
                }
                setDocToDelete(null);
            };

            const restoreFromTrash = (id) => {
                const item = deletedDocuments.find(d => d.id === id);
                if (!item) return;
                const { deletedAt, trashed, ...doc } = item;
                doc.lastModified = Date.now();
                setDocuments(prev => [doc, ...prev]);
                setDeletedDocuments(prev => prev.filter(d => d.id !== id));
                markDocDirty(id);
                notify(`Restored "${doc.title}".`);
            };

            const permanentDelete = (id) => {
                setDeletedDocuments(prev => prev.filter(d => d.id !== id));
                notify('Permanently deleted item.');
            };

            const emptyTrash = () => {
                setDeletedDocuments([]);
                notify('Recycle Bin emptied.');
            };

            // ------------------------------------------
            // 7. IMPORT & EXPORT (TXT, MD, HTML, WORD .DOC, JSON)
            // ------------------------------------------
            const handleImportFiles = (e) => {
                const files = Array.from(e.target.files || []);
                if (!files.length) return;
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const raw = String(ev.target.result || '');
                        if (file.name.toLowerCase().endsWith('.json')) {
                            try {
                                const parsed = JSON.parse(raw);
                                if (Array.isArray(parsed)) {
                                    setDocuments(prev => [...parsed, ...prev]);
                                    parsed.forEach(d => d && d.id && markDocDirty(d.id));
                                    notify(`Imported ${parsed.length} document(s) from backup.`);
                                    return;
                                }
                            } catch (err) {
                                notify('Could not parse JSON backup file.');
                                return;
                            }
                        }
                        const id = 'doc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                        const html = file.name.toLowerCase().endsWith('.html')
                            ? raw
                            : `<div style="font-family: '${defaultSettings.font}'; font-size: ${defaultSettings.size}px; line-height: 1.5;">${raw.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br/>')}</div>`;
                        const doc = {
                            id,
                            title: file.name.replace(/\.[^/.]+$/, ''),
                            content: html,
                            snippet: raw.replace(/<[^>]+>/g, '').slice(0, 120),
                            tags: 'Imported',
                            pinned: false,
                            comments: [],
                            snapshots: [],
                            lastModified: Date.now()
                        };
                        setDocuments(prev => [doc, ...prev]);
                        markDocDirty(id);
                        notify(`Imported "${doc.title}".`);
                    };
                    reader.readAsText(file);
                });
                e.target.value = '';
            };

            const handleExportAll = () => {
                const blob = new Blob([JSON.stringify(documents, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `HL_Docs_4_Backup_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                notify('Exported full JSON backup.');
            };

            const exportCurrentDocument = (formatOverride = null) => {
                if (!editorRef.current || !currentDoc) return;
                const fmt = formatOverride || advancedSettings.defaultExport || 'txt';
                let out = '';
                let mime = 'text/plain';
                if (fmt === 'doc') {
                    out = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${currentDoc.title}</title></head><body>${editorRef.current.innerHTML}</body></html>`;
                    mime = 'application/msword';
                } else if (fmt === 'html') {
                    out = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${currentDoc.title}</title></head><body>${editorRef.current.innerHTML}</body></html>`;
                    mime = 'text/html';
                } else if (fmt === 'md') {
                    out = editorRef.current.innerHTML
                        .replace(/<h1[^>]*>(.*?)<\/h1>/gi, '# $1\n\n')
                        .replace(/<h2[^>]*>(.*?)<\/h2>/gi, '## $1\n\n')
                        .replace(/<h3[^>]*>(.*?)<\/h3>/gi, '### $1\n\n')
                        .replace(/<(?:strong|b)>(.*?)<\/(?:strong|b)>/gi, '**$1**')
                        .replace(/<(?:em|i)>(.*?)<\/(?:em|i)>/gi, '*$1*')
                        .replace(/<br\s*\/?>/gi, '\n')
                        .replace(/<\/p>|<\/div>/gi, '\n')
                        .replace(/<[^>]+>/g, '');
                    mime = 'text/markdown';
                } else {
                    out = editorRef.current.innerText || '';
                }
                const blob = new Blob([out], { type: mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${(currentDoc.title || 'document').replace(/[^a-z0-9_\-\s]/gi, '_')}.${fmt}`;
                a.click();
                URL.revokeObjectURL(url);
                setActiveMenu(null);
                notify(`Exported as .${fmt}`);
            };

            // ------------------------------------------
            // 8. IMAGE ENGINE (PASTE, DRAG-REFLOW, COMPRESS & 2000s STUDIO)
            // ------------------------------------------
            const insertImageDataUrl = useCallback(async (srcUrl, altText = '') => {
                if (!srcUrl || readOnly) return;
                let finalSrc = srcUrl;
                if (String(srcUrl).startsWith('data:image/')) {
                    finalSrc = await compressImageDataUrl(srcUrl, 960, 0.80);
                }
                if (editorRef.current) editorRef.current.focus();
                restoreSelection();
                const safeSrc = String(finalSrc).replace(/"/g, '&quot;');
                const safeAlt = String(altText).replace(/"/g, '&quot;');
                document.execCommand(
                    'insertHTML',
                    false,
                    `<img src="${safeSrc}" alt="${safeAlt}" draggable="true" style="display:block; margin: 12px auto; width: 360px; max-width: 100%; height: auto;" />`
                );
                handleContentChange();
            }, [readOnly, handleContentChange]);

            const handleInsertImageSubmit = (e) => {
                e.preventDefault();
                const url = imageUrlInput.trim();
                if (!url) return;
                insertImageDataUrl(url);
                setImageUrlInput('');
                setShowImageDialog(false);
            };

            const handleLocalImageFile = (file) => {
                if (!file || !file.type || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    insertImageDataUrl(ev.target.result, file.name);
                    setShowImageDialog(false);
                };
                reader.readAsDataURL(file);
            };

            const handleEditorPaste = (e) => {
                if (readOnly) { e.preventDefault(); return; }
                const cd = e.clipboardData || window.clipboardData;
                if (!cd || !cd.items) return;
                for (let i = 0; i < cd.items.length; i++) {
                    const item = cd.items[i];
                    if (item && item.type && item.type.indexOf('image') !== -1) {
                        e.preventDefault();
                        const file = item.getAsFile();
                        if (file) handleLocalImageFile(file);
                        return;
                    }
                }
            };

            const handleEditorDragStart = (e) => {
                if (readOnly) return;
                if (e.target && e.target.tagName === 'IMG' && editorRef.current && editorRef.current.contains(e.target)) {
                    draggedImgRef.current = e.target;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', 'hl-docs-internal-img');
                }
            };

            const handleEditorDragOver = (e) => {
                if (readOnly) return;
                if (draggedImgRef.current || (e.dataTransfer && e.dataTransfer.types && Array.from(e.dataTransfer.types).includes('Files'))) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = draggedImgRef.current ? 'move' : 'copy';
                }
            };

            const handleEditorDrop = (e) => {
                if (readOnly) return;

                // 1. Repositioning an existing image inside the document (reflows text, never overlaps!)
                if (draggedImgRef.current && editorRef.current && editorRef.current.contains(draggedImgRef.current)) {
                    e.preventDefault();
                    const imgEl = draggedImgRef.current;
                    draggedImgRef.current = null;

                    let dropRange = null;
                    if (document.caretRangeFromPoint) {
                        dropRange = document.caretRangeFromPoint(e.clientX, e.clientY);
                    } else if (document.caretPositionFromPoint) {
                        const pos = document.caretPositionFromPoint(e.clientX, e.clientY);
                        if (pos) {
                            dropRange = document.createRange();
                            dropRange.setStart(pos.offsetNode, pos.offset);
                            dropRange.collapse(true);
                        }
                    }

                    if (dropRange && editorRef.current.contains(dropRange.startContainer)) {
                        // Avoid dropping an image inside itself
                        if (dropRange.startContainer !== imgEl && !imgEl.contains(dropRange.startContainer)) {
                            dropRange.insertNode(imgEl);
                            const sel = window.getSelection();
                            if (sel) {
                                sel.removeAllRanges();
                                const afterRange = document.createRange();
                                afterRange.setStartAfter(imgEl);
                                afterRange.collapse(true);
                                sel.addRange(afterRange);
                            }
                            setActiveImage(imgEl);
                            handleContentChange();
                            notify('Moved image into text flow.');
                        }
                    }
                    return;
                }

                // 2. Dropping a new image file from the user's computer
                const files = e.dataTransfer && e.dataTransfer.files;
                if (files && files.length > 0) {
                    const imgFile = Array.from(files).find(f => f.type && f.type.startsWith('image/'));
                    if (imgFile) {
                        e.preventDefault();
                        handleLocalImageFile(imgFile);
                    }
                }
            };

            const openImageEditorModal = (imgEl) => {
                const target = imgEl || activeImage;
                if (!target) return;
                const rect = target.getBoundingClientRect();
                const scale = zoomLevel / 100;
                const w = Math.round(parseInt(target.style.width, 10) || (rect.width / scale) || target.naturalWidth || 300);
                const h = Math.round((rect.height / scale) || target.naturalHeight || 220);
                let align = 'center';
                if (target.style.float === 'left') align = 'left';
                else if (target.style.float === 'right') align = 'right';
                else if (target.style.display === 'inline' || target.style.display === 'inline-block') align = 'inline';

                setImgEditState({
                    widthPx: Math.max(40, w),
                    heightPx: Math.max(40, h),
                    lockAspect: true,
                    aspectRatio: w / Math.max(1, h),
                    rotation: parseInt(target.dataset.rotation || '0', 10) || 0,
                    flipH: target.dataset.flipH === '1',
                    flipV: target.dataset.flipV === '1',
                    brightness: parseInt(target.dataset.brightness || '100', 10) || 100,
                    contrast: parseInt(target.dataset.contrast || '100', 10) || 100,
                    grayscale: parseInt(target.dataset.grayscale || '0', 10) || 0,
                    sepia: parseInt(target.dataset.sepia || '0', 10) || 0,
                    borderStyle: target.dataset.retroBorder || 'none',
                    align,
                    alt: target.alt || ''
                });
                setShowImageEditor(true);
            };

            const applyImageEditorChanges = () => {
                if (!activeImage) return;
                const s = imgEditState;
                activeImage.style.width = `${s.widthPx}px`;
                activeImage.style.height = s.lockAspect ? 'auto' : `${s.heightPx}px`;
                const transforms = [];
                if (s.rotation) transforms.push(`rotate(${s.rotation}deg)`);
                if (s.flipH) transforms.push('scaleX(-1)');
                if (s.flipV) transforms.push('scaleY(-1)');
                activeImage.style.transform = transforms.join(' ');
                activeImage.style.filter = `brightness(${s.brightness}%) contrast(${s.contrast}%) grayscale(${s.grayscale}%) sepia(${s.sepia}%)`;

                // Apply non-overlapping text wrap / layout flow
                if (s.align === 'left') {
                    activeImage.style.display = 'block';
                    activeImage.style.float = 'left';
                    activeImage.style.clear = 'none';
                    activeImage.style.margin = '4px 16px 10px 0';
                } else if (s.align === 'right') {
                    activeImage.style.display = 'block';
                    activeImage.style.float = 'right';
                    activeImage.style.clear = 'none';
                    activeImage.style.margin = '4px 0 10px 16px';
                } else if (s.align === 'inline') {
                    activeImage.style.display = 'inline-block';
                    activeImage.style.float = 'none';
                    activeImage.style.clear = 'none';
                    activeImage.style.verticalAlign = 'middle';
                    activeImage.style.margin = '4px 6px';
                } else {
                    activeImage.style.display = 'block';
                    activeImage.style.float = 'none';
                    activeImage.style.clear = 'both';
                    activeImage.style.margin = '12px auto';
                }

                if (s.borderStyle === 'thin') {
                    activeImage.style.border = '1px solid #000000';
                    activeImage.style.padding = '0';
                    activeImage.style.boxShadow = 'none';
                } else if (s.borderStyle === 'bevel') {
                    activeImage.style.borderTop = '3px solid #FFFFFF';
                    activeImage.style.borderLeft = '3px solid #FFFFFF';
                    activeImage.style.borderRight = '3px solid #404040';
                    activeImage.style.borderBottom = '3px solid #404040';
                    activeImage.style.padding = '3px';
                    activeImage.style.backgroundColor = '#D4D0C8';
                    activeImage.style.boxShadow = 'none';
                } else if (s.borderStyle === 'shadow') {
                    activeImage.style.border = '1px solid #404040';
                    activeImage.style.padding = '4px';
                    activeImage.style.backgroundColor = '#FFFFFF';
                    activeImage.style.boxShadow = '4px 4px 0px rgba(0,0,0,0.35)';
                } else {
                    activeImage.style.border = 'none';
                    activeImage.style.padding = '0';
                    activeImage.style.backgroundColor = 'transparent';
                    activeImage.style.boxShadow = 'none';
                }

                activeImage.alt = s.alt;
                activeImage.dataset.rotation = String(s.rotation);
                activeImage.dataset.flipH = s.flipH ? '1' : '0';
                activeImage.dataset.flipV = s.flipV ? '1' : '0';
                activeImage.dataset.brightness = String(s.brightness);
                activeImage.dataset.contrast = String(s.contrast);
                activeImage.dataset.grayscale = String(s.grayscale);
                activeImage.dataset.sepia = String(s.sepia);
                activeImage.dataset.retroBorder = s.borderStyle;

                handleContentChange();
                setShowImageEditor(false);
                notify('Applied Image Studio changes.');
            };

            const deleteActiveImage = () => {
                if (!activeImage) return;
                activeImage.remove();
                setActiveImage(null);
                setImageHandleBox(null);
                setShowImageEditor(false);
                handleContentChange();
                notify('Image removed.');
            };

            const moveActiveImageBlock = (direction) => {
                if (!activeImage || !editorRef.current) return;
                const parentBlock = activeImage.closest('p, div, h1, h2, h3, li');
                if (parentBlock && parentBlock !== editorRef.current) {
                    if (direction === 'up' && parentBlock.previousElementSibling) {
                        parentBlock.parentNode.insertBefore(activeImage, parentBlock.previousElementSibling);
                    } else if (direction === 'down' && parentBlock.nextElementSibling) {
                        parentBlock.parentNode.insertBefore(activeImage, parentBlock.nextElementSibling.nextSibling);
                    }
                } else {
                    if (direction === 'up' && activeImage.previousElementSibling) {
                        activeImage.parentNode.insertBefore(activeImage, activeImage.previousElementSibling);
                    } else if (direction === 'down' && activeImage.nextElementSibling) {
                        activeImage.parentNode.insertBefore(activeImage, activeImage.nextElementSibling.nextSibling);
                    }
                }
                handleContentChange();
            };

            const applyColumnWidth = (pxVal) => {
                if (!activeCell) return;
                const val = parseInt(pxVal, 10);
                setCellWidthPx(pxVal);
                if (isNaN(val) || val < 30) return;
                const table = activeCell.closest('table');
                const colIdx = activeCell.cellIndex;
                if (table) {
                    Array.from(table.rows).forEach(r => {
                        if (r.cells[colIdx]) r.cells[colIdx].style.width = `${val}px`;
                    });
                }
                handleContentChange();
            };

            const applyRowHeight = (pxVal) => {
                if (!activeCell) return;
                const val = parseInt(pxVal, 10);
                setRowHeightPx(pxVal);
                if (isNaN(val) || val < 18) return;
                const row = activeCell.parentElement;
                if (row) {
                    row.style.height = `${val}px`;
                    Array.from(row.cells).forEach(c => { c.style.height = `${val}px`; });
                }
                handleContentChange();
            };

            const modifyTableStructure = (action) => {
                if (!activeCell) return;
                const row = activeCell.parentElement;
                const table = activeCell.closest('table');
                if (!row || !table) return;
                const rowIdx = row.rowIndex;
                const colIdx = activeCell.cellIndex;
                const colCount = row.cells.length;

                if (action === 'addRowAbove' || action === 'addRowBelow') {
                    const newRow = table.insertRow(action === 'addRowAbove' ? rowIdx : rowIdx + 1);
                    for (let i = 0; i < colCount; i++) {
                        const cell = newRow.insertCell(i);
                        cell.innerHTML = '&#8203;';
                    }
                } else if (action === 'delRow') {
                    if (table.rows.length <= 1) { table.remove(); setActiveCell(null); }
                    else { table.deleteRow(rowIdx); setActiveCell(null); }
                } else if (action === 'addColLeft' || action === 'addColRight') {
                    const targetIdx = action === 'addColLeft' ? colIdx : colIdx + 1;
                    Array.from(table.rows).forEach(r => {
                        const cell = r.insertCell(Math.min(targetIdx, r.cells.length));
                        cell.innerHTML = '&#8203;';
                    });
                } else if (action === 'delCol') {
                    if (colCount <= 1) { table.remove(); setActiveCell(null); }
                    else {
                        Array.from(table.rows).forEach(r => { if (r.cells[colIdx]) r.deleteCell(colIdx); });
                        setActiveCell(null);
                    }
                } else if (action === 'delTable') {
                    table.remove();
                    setActiveCell(null);
                }
                handleContentChange();
            };

            const setCellBackground = (color) => {
                if (!activeCell) return;
                activeCell.style.backgroundColor = color;
                handleContentChange();
            };

            const handleInsertLinkSubmit = (e) => {
                e.preventDefault();
                const url = linkUrlInput.trim();
                if (!url) return;
                const label = linkTextInput.trim() || url;
                if (editorRef.current) editorRef.current.focus();
                restoreSelection();
                const safeUrl = url.replace(/"/g, '&quot;');
                const safeLabel = label.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                document.execCommand('insertHTML', false, `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeLabel}</a>`);
                handleContentChange();
                setLinkUrlInput('');
                setLinkTextInput('');
                setShowLinkDialog(false);
            };

            const handleInsertTableSubmit = (e) => {
                e.preventDefault();
                const rCount = Math.max(1, Math.min(20, parseInt(tableRows, 10) || 3));
                const cCount = Math.max(1, Math.min(12, parseInt(tableCols, 10) || 3));
                let html = '<table class="doc-table"><tbody>';
                for (let r = 0; r < rCount; r++) {
                    html += '<tr>';
                    for (let c = 0; c < cCount; c++) html += '<td>&#8203;</td>';
                    html += '</tr>';
                }
                html += '</tbody></table><p>&#8203;</p>';
                if (editorRef.current) editorRef.current.focus();
                restoreSelection();
                document.execCommand('insertHTML', false, html);
                handleContentChange();
                setShowTableDialog(false);
            };

            const insertCheckbox = () => {
                if (readOnly) return;
                if (editorRef.current) editorRef.current.focus();
                restoreSelection();
                document.execCommand('insertHTML', false, `<span class="doc-checkbox" contenteditable="false" style="cursor:pointer; font-size:1.15em; margin-right:6px; user-select:none;">☐</span>&nbsp;`);
                handleContentChange();
                setActiveMenu(null);
            };

            const handleFindReplaceSubmit = (e) => {
                e.preventDefault();
                if (!editorRef.current || !findText || readOnly) return;
                const escaped = findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escaped, 'g');
                let count = 0;
                const walker = document.createTreeWalker(editorRef.current, NodeFilter.SHOW_TEXT, null, false);
                let node;
                while ((node = walker.nextNode())) {
                    if (regex.test(node.nodeValue)) {
                        const matches = node.nodeValue.match(regex);
                        count += matches ? matches.length : 0;
                        node.nodeValue = node.nodeValue.replace(regex, replaceText);
                    }
                }
                if (count > 0) {
                    handleContentChange();
                    notify(`Replaced ${count} occurrence(s) of "${findText}".`);
                } else {
                    notify(`No matches found for "${findText}".`);
                }
                setShowFindReplace(false);
            };

            // Editor Click & KeyDown Handlers
            const handleEditorClick = (e) => {
                if (readOnly) return;
                if (e.target.tagName === 'IMG') {
                    if (activeImage && activeImage !== e.target) activeImage.classList.remove('selected-img');
                    e.target.classList.add('selected-img');
                    setActiveImage(e.target);
                    const pct = parseInt(e.target.style.width, 10);
                    setImageWidth(e.target.style.width && e.target.style.width.endsWith('%') && !isNaN(pct) ? pct : 100);
                } else {
                    if (activeImage) activeImage.classList.remove('selected-img');
                    setActiveImage(null);
                }

                const td = e.target.closest ? e.target.closest('td, th') : null;
                if (td && editorRef.current && editorRef.current.contains(td)) {
                    if (activeCell && activeCell !== td) activeCell.classList.remove('selected-cell');
                    td.classList.add('selected-cell');
                    setActiveCell(td);
                    const rect = td.getBoundingClientRect();
                    setCellWidthPx(String(Math.round(parseInt(td.style.width, 10) || rect.width)));
                    setRowHeightPx(String(Math.round(parseInt(td.parentElement && td.parentElement.style.height, 10) || rect.height)));
                } else {
                    if (activeCell) activeCell.classList.remove('selected-cell');
                    setActiveCell(null);
                }

                if (e.target.classList.contains('doc-checkbox')) {
                    e.target.innerText = e.target.innerText === '☐' ? '☑' : '☐';
                    e.target.style.color = e.target.innerText === '☑' ? '#000080' : '#000000';
                    handleContentChange();
                }
            };

            const handleEditorKeyDown = (e) => {
                if (readOnly) return;
                if (e.key === 'Tab') {
                    e.preventDefault();
                    document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
                    handleContentChange();
                    return;
                }
                if (e.key === ' ' || e.key === 'Enter') {
                    const sel = window.getSelection();
                    if (sel && sel.rangeCount > 0 && sel.isCollapsed) {
                        const range = sel.getRangeAt(0);
                        const node = range.startContainer;
                        const offset = range.startOffset;
                        if (node && node.nodeType === 3) {
                            const before = node.textContent.substring(0, offset);
                            const trimmed = before.trim();
                            if (trimmed === '1.' || trimmed === '1)') {
                                e.preventDefault();
                                node.textContent = node.textContent.substring(offset);
                                document.execCommand('insertOrderedList');
                                handleContentChange();
                                return;
                            }
                            if (trimmed === '-' || trimmed === '*') {
                                e.preventDefault();
                                node.textContent = node.textContent.substring(offset);
                                document.execCommand('insertUnorderedList');
                                handleContentChange();
                                return;
                            }
                            if (trimmed === '#') {
                                e.preventDefault();
                                node.textContent = node.textContent.substring(offset);
                                document.execCommand('formatBlock', false, 'H1');
                                handleContentChange();
                                return;
                            }
                            if (trimmed === '##') {
                                e.preventDefault();
                                node.textContent = node.textContent.substring(offset);
                                document.execCommand('formatBlock', false, 'H2');
                                handleContentChange();
                                return;
                            }
                            if (e.key === ' ' && advancedSettings.enableAutocorrect) {
                                const m = before.match(/([a-zA-Z']+)$/);
                                if (m) {
                                    const lower = m[1].toLowerCase();
                                    if (OFFLINE_AUTOCORRECT_MAP[lower]) {
                                        e.preventDefault();
                                        const fixed = OFFLINE_AUTOCORRECT_MAP[lower];
                                        const isCap = m[1][0] === m[1][0].toUpperCase();
                                        const finalWord = isCap ? fixed.charAt(0).toUpperCase() + fixed.slice(1) : fixed;
                                        const after = node.textContent.substring(offset);
                                        const newBefore = before.substring(0, before.length - m[1].length) + finalWord + ' ';
                                        node.textContent = newBefore + after;
                                        const newRange = document.createRange();
                                        newRange.setStart(node, newBefore.length);
                                        newRange.collapse(true);
                                        sel.removeAllRanges();
                                        sel.addRange(newRange);
                                        handleContentChange();
                                    }
                                }
                            }
                        }
                    }
                }
            };

            const toggleTTS = () => {
                if (!window.speechSynthesis || !editorRef.current) {
                    notify('Text-to-Speech is not supported in this browser.');
                    return;
                }
                if (isSpeaking) {
                    window.speechSynthesis.cancel();
                    setIsSpeaking(false);
                } else {
                    const text = (editorRef.current.innerText || '').trim();
                    if (!text) return;
                    const u = new SpeechSynthesisUtterance(text);
                    u.onend = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(u);
                    setIsSpeaking(true);
                }
            };

            const handleCalcPress = (btn) => {
                if (btn === 'C') setCalcInput('');
                else if (btn === 'DEL') setCalcInput(prev => prev === 'Error' ? '' : prev.slice(0, -1));
                else setCalcInput(prev => prev === 'Error' ? btn : prev + btn);
            };

            const evaluateCalc = () => {
                if (!calcInput || calcInput === 'Error') return;
                try {
                    const expr = calcInput.replace(/÷/g, '/').replace(/×/g, '*').replace(/[^-()\d/*+.]/g, '');
                    if (!expr) return;
                    const res = new Function('return ' + expr)();
                    setCalcInput(!isFinite(res) || isNaN(res) ? 'Error' : String(res));
                } catch (e) {
                    setCalcInput('Error');
                }
            };

            // Tags & Filtering for Home Explorer
            const allTags = useMemo(() => {
                const set = new Set();
                documents.forEach(d => {
                    if (d && d.tags) {
                        String(d.tags).split(',').map(t => t.trim()).filter(Boolean).forEach(t => set.add(t));
                    }
                });
                return Array.from(set).sort();
            }, [documents]);

            const filteredDocs = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                return [...documents]
                    .sort((a, b) => (a.pinned === b.pinned ? (b.lastModified || 0) - (a.lastModified || 0) : a.pinned ? -1 : 1))
                    .filter(d => {
                        if (activeTagFilter === 'PINNED' && !d.pinned) return false;
                        if (activeTagFilter !== 'ALL' && activeTagFilter !== 'PINNED') {
                            const docTags = String(d.tags || '').toLowerCase().split(',').map(s => s.trim());
                            if (!docTags.includes(activeTagFilter.toLowerCase())) return false;
                        }
                        return !q ||
                            String(d.title || '').toLowerCase().includes(q) ||
                            String(d.tags || '').toLowerCase().includes(q) ||
                            String(d.snippet || '').toLowerCase().includes(q);
                    });
            }, [documents, searchQuery, activeTagFilter]);

            const scrollToHeading = (elem) => {
                if (scrollRef.current && elem) {
                    const rect = elem.getBoundingClientRect();
                    const sRect = scrollRef.current.getBoundingClientRect();
                    scrollRef.current.scrollTo({
                        top: scrollRef.current.scrollTop + (rect.top - sRect.top) - 40,
                        behavior: 'smooth'
                    });
                }
            };

            const dirtyCount = Object.keys(dirtyDocIds).length;
            const renderSyncBadge = () => {
                if (!authSession) {
                    return <span className="font-bold" style={{ color: '#404040' }}>[Local Only — Sign In for Cloud Backup]</span>;
                }
                if (!isOnline || syncStatus === 'offline') {
                    return <span className="font-bold" style={{ color: '#8B0000' }}>[Offline — Saved Locally{dirtyCount > 0 ? ` (${dirtyCount} queued)` : ''}]</span>;
                }
                if (syncStatus === 'syncing') {
                    return <span className="font-bold" style={{ color: '#000080' }}>[Backing up to Cloud...]</span>;
                }
                if (syncStatus === 'error') {
                    return <span className="font-bold" style={{ color: '#8B0000' }} title={syncErrorMsg}>[Cloud Backup Retry Pending]</span>;
                }
                if (dirtyCount > 0) {
                    return <span className="font-bold" style={{ color: '#804000' }}>[Cloud Backup Pending]</span>;
                }
                const tStr = lastCloudSyncTime
                    ? lastCloudSyncTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    : 'Ready';
                return <span className="font-bold" style={{ color: '#006400' }}>[Cloud Backed Up ({tStr})]</span>;
            };

            // ==========================================
            // RENDER: SIGN IN / CREATE ACCOUNT MODAL
            // ==========================================
            const renderAuthModal = () => {
                if (!showAuthModal) return null;
                return (
                    <div className="fixed inset-0 z-[700] flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.55)' }} onClick={() => setShowAuthModal(false)}>
                        <div className="win-raised w-full max-w-md" style={{ boxShadow: '6px 6px 0 rgba(0,0,0,0.5)' }} onClick={e => e.stopPropagation()}>
                            <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between text-xs font-bold">
                                <div className="flex items-center gap-2">
                                    <RetroKeyIcon size={14} />
                                    <span>HL Docs 4 — Cloud Backup Sign In</span>
                                </div>
                                <button type="button" className="win-btn" style={{ padding: '0 6px', fontSize: '10px' }} onClick={() => setShowAuthModal(false)}>X</button>
                            </div>

                            {/* Classic 2000s Banner */}
                            <div
                                className="px-4 py-3 flex items-center justify-between border-b border-[#808080]"
                                style={{ background: 'linear-gradient(90deg, #000040 0%, #000080 55%, #1084D0 100%)', color: '#FFFFFF' }}
                            >
                                <div>
                                    <div className="text-base font-bold tracking-wide">HL Docs 4</div>
                                    <div className="text-[11px]" style={{ color: '#DCE8FA' }}>Sign in to enable Cloud Backup across devices</div>
                                </div>
                                <div className="flex items-center gap-2 px-2.5 py-1.5" style={{ backgroundColor: 'rgba(255,255,255,0.12)', border: '1px solid rgba(255,255,255,0.35)' }}>
                                    <RetroDocsIcon size={22} />
                                    <RetroCloudIcon size={22} />
                                </div>
                            </div>

                            {/* Sign In / Create Account Tabs */}
                            <div className="px-3 pt-2 flex items-end gap-1" style={{ borderBottom: '1px solid #808080' }}>
                                <button
                                    type="button"
                                    onClick={() => { setAuthMode('login'); setAuthError(''); }}
                                    className={`win-tab ${authMode === 'login' ? 'active' : ''}`}
                                >
                                    Sign In
                                </button>
                                <button

                            </div>
                        )}

                        {!focusMode && (
                            <div
                                className="px-2 py-1.5 flex flex-wrap items-center justify-between gap-2 shrink-0"
                                style={{ backgroundColor: '#D4D0C8', borderBottom: '1px solid #808080', boxShadow: 'inset 0 1px 0 #FFFFFF' }}
                            >
                                <div className="flex items-center gap-1.5 flex-1 min-w-[220px]">
                                    <button type="button" className="win-btn" onClick={() => setCurrentView('home')} title="Back to My Documents">
                                        <RetroFolderIcon size={14} /> Docs
                                    </button>
                                    <input
                                        type="text"
                                        value={currentDoc.title || ''}
                                        onChange={(e) => updateDocMeta('title', e.target.value)}

                                        placeholder="Untitled Document"
                                        className="win-input font-bold flex-1 max-w-xs"
                                    />
                                    <input
                                        type="text"
                                        value={currentDoc.tags || ''}
                                        onChange={(e) => updateDocMeta('tags', e.target.value)}
                                        disabled={readOnly}
                                        placeholder="Tag (e.g. Notes)"
                                        className="win-input w-24 hidden lg:block text-[11px]"
                                        title="Comma-separated document tags"
                                    />
                                    <span className="text-[10px] font-bold hidden xl:inline" style={{ color: '#006400' }}>
                                        [{saveIndicator}]
                                    </span>
                                </div>

                                <div className="flex flex-wrap items-center gap-1">
                                    <button type="button" className={`win-btn ${showTOC ? 'active' : ''}`} onClick={() => setShowTOC(v => !v)}>Outline</button>
                                    <button type="button" className={`win-btn ${showComments ? 'active' : ''}`} onClick={() => setShowComments(v => !v)}>Notes ({(currentDoc.comments || []).length})</button>
                                    <button type="button" className="win-btn" onClick={() => setFocusMode(true)} title="Distraction-Free Focus Mode">Focus</button>
                                    <button type="button" className={`win-btn ${readOnly ? 'active' : ''}`} onClick={() => setReadOnly(r => !r)} style={readOnly ? { color: '#8B0000' } : undefined}>
                                        {readOnly ? 'Locked' : 'Lock'}

                                    <button type="button" className="win-btn" onClick={() => setShowFindReplace(true)}>Find</button>
                                    <button type="button" className={`win-btn ${showCalculator ? 'active' : ''}`} onClick={() => setShowCalculator(c => !c)}>Calc</button>
                                    <button type="button" className="win-btn" onClick={saveVersionSnapshot} title="Save Version Snapshot">Snapshot</button>
                                    <button type="button" className="win-btn" onClick={() => exportCurrentDocument()}>Export</button>
                                    <button type="button" className="win-btn" onClick={() => window.print()}>Print</button>
                                    {/* Fixed Zoom Controls */}
                                    <div className="flex items-center gap-0.5 ml-1 pl-1.5 border-l border-[#808080]">
                                        <button type="button" className="win-btn" style={{ padding: '2px 7px' }} onClick={() => setZoomLevel(z => Math.max(50, z - 10))} title="Zoom Out">-</button>

                                            value={[50, 75, 90, 100, 125, 150, 175, 200].includes(zoomLevel) ? zoomLevel : 'custom'}

                                            title="Zoom Level"
                                        >
                                            {![50, 75, 90, 100, 125, 150, 175, 200].includes(zoomLevel) && (
                                                <option value="custom">{zoomLevel}%</option>
                                            )}
                                            {[50, 75, 90, 100, 125, 150, 175, 200].map(z => (
                                                <option key={z} value={z}>{z}%</option>
                                            ))}
                                        </select>
                                        <button type="button" className="win-btn" style={{ padding: '2px 7px' }} onClick={() => setZoomLevel(z => Math.min(200, z + 10))} title="Zoom In">+</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Formatting Toolbar Row 2 */}
                        {!focusMode && (
                            <div
                                className="px-2 py-1 flex items-center gap-0.5 overflow-x-auto shrink-0"

                                onClick={e => e.stopPropagation()}
                            >
                                <button type="button" disabled={readOnly} className="win-tool-btn" onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('undo')} title="Undo">↶</button>
                                <button type="button" disabled={readOnly} className="win-tool-btn" onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('redo')} title="Redo">↷</button>
                                <button type="button" disabled={readOnly} className="win-tool-btn" onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('removeFormat')} title="Clear Formatting">Tx</button>

                                <div className="win-separator" />

                                <select
                                    disabled={readOnly}
                                    className="win-select w-24"
                                    defaultValue="P"
                                    onChange={(e) => { executeCommand('formatBlock', e.target.value); e.target.value = 'P'; }}

                                >
                                    <option value="P">Normal</option>
                                    <option value="H1">Heading 1</option>
                                    <option value="H2">Heading 2</option>
                                    <option value="H3">Heading 3</option>
                                    <option value="BLOCKQUOTE">Quote</option>
                                    <option value="PRE">Code Block</option>
                                </select>

                                <select
                                    disabled={readOnly}
                                    value={FONTS.includes(currentFontName) ? currentFontName : defaultSettings.font}

                                    title="Font Family (55+ Fonts)"

                                    {FONTS.map(f => <option key={f} value={f} style={{ fontFamily: f }}>{f}</option>)}

                                <select
                                    disabled={readOnly}

                                    onChange={(e) => handleFontSizeChange(e.target.value)}

                                <button type="button" disabled={readOnly} className={`win-tool-btn ${activeFormats.strikeThrough ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('strikeThrough')} title="Strikethrough"><s>S</s></button>
                                <button type="button" disabled={readOnly} className={`win-tool-btn ${activeFormats.subscript ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('subscript')} title="Subscript">x<sub>2</sub></button>
                                <button type="button" disabled={readOnly} className={`win-tool-btn ${activeFormats.superscript ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('superscript')} title="Superscript">x<sup>2</sup></button>

                                <div className="win-separator" />

                                    <button type="button" disabled={readOnly} className={`win-tool-btn ${activeMenu === 'foreColor' ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => setActiveMenu(activeMenu === 'foreColor' ? null : 'foreColor')} title="Font Color">

                                    </button>
