                                        <div className="win-dropdown fixed mt-1 p-2.5 w-48" style={{ zIndex: 300 }}>
                                            <div className="text-[10px] font-bold mb-1.5">Font Color:</div>
                                            <div className="grid grid-cols-5 gap-1 mb-2">
                                                {PRESET_COLORS.map(c => (
                                                    <button key={c} type="button" onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('foreColor', c)} style={{ backgroundColor: c, width: '24px', height: '20px', border: '1px solid #404040', cursor: 'pointer' }} />
                                                ))}
                                            </div>
                                            <button type="button" className="win-btn w-full" onMouseDown={e => e.preventDefault()} onClick={() => customTextColorRef.current && customTextColorRef.current.click()}>More Colors...</button>
                                            <input ref={customTextColorRef} type="color" className="hidden" onChange={e => executeCommand('foreColor', e.target.value)} />
                                        </div>
                                    )}
                                </div>

                                {/* Highlight Color */}
                                <div className="relative">
                                    <button type="button" disabled={readOnly} className={`win-tool-btn ${activeMenu === 'hiliteColor' ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => setActiveMenu(activeMenu === 'hiliteColor' ? null : 'hiliteColor')} title="Highlight Color">
                                        <span style={{ backgroundColor: '#FFFF00', padding: '0 3px', border: '1px solid #808000' }}>ab</span>
                                    </button>
                                    {activeMenu === 'hiliteColor' && (
                                        <div className="win-dropdown fixed mt-1 p-2.5 w-48" style={{ zIndex: 300 }}>
                                            <div className="text-[10px] font-bold mb-1.5">Highlight Color:</div>
                                            <div className="grid grid-cols-5 gap-1 mb-2">
                                                {PRESET_COLORS.map(c => (
                                                    <button key={c} type="button" onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('hiliteColor', c)} style={{ backgroundColor: c, width: '24px', height: '20px', border: '1px solid #404040', cursor: 'pointer' }} />
                                                ))}
                                            </div>
                                            <button type="button" className="win-btn w-full" onMouseDown={e => e.preventDefault()} onClick={() => customHighlightRef.current && customHighlightRef.current.click()}>More Colors...</button>
                                            <input ref={customHighlightRef} type="color" className="hidden" onChange={e => executeCommand('hiliteColor', e.target.value)} />
                                        </div>
                                    )}
                                </div>

                                <div className="win-separator" />

                                <button type="button" disabled={readOnly} className={`win-tool-btn ${activeFormats.justifyLeft ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('justifyLeft')} title="Align Left">≡L</button>
                                <button type="button" disabled={readOnly} className={`win-tool-btn ${activeFormats.justifyCenter ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('justifyCenter')} title="Center">≡C</button>
                                <button type="button" disabled={readOnly} className={`win-tool-btn ${activeFormats.justifyRight ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('justifyRight')} title="Align Right">≡R</button>
                                <button type="button" disabled={readOnly} className={`win-tool-btn ${activeFormats.justifyFull ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('justifyFull')} title="Justify">≡J</button>

                                <div className="win-separator" />

                                <button type="button" disabled={readOnly} className={`win-tool-btn ${activeFormats.insertUnorderedList ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('insertUnorderedList')} title="Bullet List">•≡</button>
                                <button type="button" disabled={readOnly} className={`win-tool-btn ${activeFormats.insertOrderedList ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('insertOrderedList')} title="Numbered List">1.</button>
                                <button type="button" disabled={readOnly} className="win-tool-btn" onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('outdent')} title="Decrease Indent">←≡</button>
                                <button type="button" disabled={readOnly} className="win-tool-btn" onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('indent')} title="Increase Indent">→≡</button>

                                <select disabled={readOnly} className="win-select w-16 ml-1" defaultValue="1.5" onChange={(e) => changeLineSpacing(e.target.value)} title="Line Spacing">
                                    <option value="1.0">1.0x</option>
                                    <option value="1.15">1.15x</option>
                                    <option value="1.5">1.5x</option>
                                    <option value="2.0">2.0x</option>
                                </select>

                                <div className="win-separator" />

                                <button type="button" disabled={readOnly} className="win-tool-btn" onMouseDown={e => e.preventDefault()} onClick={() => transformCase('upper')} title="UPPERCASE">AA</button>
                                <button type="button" disabled={readOnly} className="win-tool-btn" onMouseDown={e => e.preventDefault()} onClick={() => transformCase('title')} title="Title Case">Aa</button>
                                <button type="button" disabled={readOnly} className="win-tool-btn" onClick={() => setShowLinkDialog(true)} title="Insert Hyperlink">Link</button>
                                <button type="button" disabled={readOnly} className="win-tool-btn" onClick={() => setShowImageDialog(true)} title="Insert Image">Img</button>
                                <button type="button" disabled={readOnly} className="win-tool-btn" onClick={() => setShowTableDialog(true)} title="Insert Table">Tbl</button>
                                <button type="button" disabled={readOnly} className="win-tool-btn" onMouseDown={e => e.preventDefault()} onClick={insertCheckbox} title="Insert Checkbox">☑</button>

                                <div className="relative">
                                    <button type="button" disabled={readOnly} className={`win-tool-btn ${activeMenu === 'emoji' ? 'active' : ''}`} onMouseDown={e => e.preventDefault()} onClick={() => setActiveMenu(activeMenu === 'emoji' ? null : 'emoji')} title="Insert Symbol / Emoji">
                                        Ω/☺
                                    </button>
                                    {activeMenu === 'emoji' && (
                                        <div className="win-dropdown fixed mt-1 p-2.5 w-60" style={{ zIndex: 300 }}>
                                            <div className="text-[10px] font-bold mb-1">Symbols:</div>
                                            <div className="grid grid-cols-6 gap-0.5 mb-2">
                                                {SPECIAL_CHARS.map(ch => (
                                                    <button key={ch} type="button" className="win-tool-btn text-xs" onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('insertText', ch)}>{ch}</button>

                                            </div>
                                            <div className="text-[10px] font-bold mb-1">Emojis:</div>
                                            <div className="grid grid-cols-4 gap-1">
                                                {EMOJIS.map(em => (
                                                    <button key={em} type="button" className="win-tool-btn text-base" onMouseDown={e => e.preventDefault()} onClick={() => executeCommand('insertText', em)}>{em}</button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Classic Ruler */}
                        {!focusMode && advancedSettings.showRuler && (
                            <div className="classic-ruler shrink-0 flex items-center justify-center overflow-hidden">
                                <div className="w-[794px] max-w-full flex justify-between px-12 text-[9px] font-bold text-[#404040] select-none">
                                    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
                                </div>
                            </div>
                        )}

                        {/* Inline Image Properties Bar */}
                        {!focusMode && activeImage && !readOnly && (
                            <div className="px-3 py-1.5 flex flex-wrap items-center gap-1.5 shrink-0" style={{ backgroundColor: '#FFFFE1', borderBottom: '1px solid #808000' }}>
                                <span className="text-[11px] font-bold" style={{ color: '#000080' }}>Picture Tools (Drag image in text to move):</span>
                                <button type="button" className="win-btn win-btn-primary" onClick={() => openImageEditorModal(activeImage)}>2000s Image Editor...</button>
                                <button type="button" className="win-btn" onClick={() => { activeImage.style.display = 'inline-block'; activeImage.style.float = 'none'; activeImage.style.clear = 'none'; activeImage.style.verticalAlign = 'middle'; activeImage.style.margin = '4px 6px'; handleContentChange(); }}>In Line</button>
                                <button type="button" className="win-btn" onClick={() => { activeImage.style.display = 'block'; activeImage.style.float = 'left'; activeImage.style.clear = 'none'; activeImage.style.margin = '4px 16px 10px 0'; handleContentChange(); }}>Wrap Left</button>
                                <button type="button" className="win-btn" onClick={() => { activeImage.style.display = 'block'; activeImage.style.float = 'none'; activeImage.style.clear = 'both'; activeImage.style.margin = '12px auto'; handleContentChange(); }}>Break Center</button>
                                <button type="button" className="win-btn" onClick={() => { activeImage.style.display = 'block'; activeImage.style.float = 'right'; activeImage.style.clear = 'none'; activeImage.style.margin = '4px 0 10px 16px'; handleContentChange(); }}>Wrap Right</button>
                                <button type="button" className="win-btn" onClick={() => moveActiveImageBlock('up')} title="Move Image Up in Text Flow">Move Up</button>
                                <button type="button" className="win-btn" onClick={() => moveActiveImageBlock('down')} title="Move Image Down in Text Flow">Move Down</button>
                                <div className="flex items-center gap-1.5 ml-1">
                                    <span className="text-[11px] font-bold">Size: {imageWidth}%</span>
                                    <input
                                        type="range" min="15" max="100" value={imageWidth}
                                        onChange={(e) => {
                                            const v = e.target.value;
                                            setImageWidth(v);
                                            activeImage.style.width = `${v}%`;
                                            activeImage.style.height = 'auto';
                                            handleContentChange();
                                        }}
                                    />
                                </div>
                                <button type="button" className="win-btn" style={{ color: '#8B0000' }} onClick={deleteActiveImage}>Delete</button>
                            </div>
                        )}

                        {/* Contextual Table Tools Bar */}
                        {!focusMode && activeCell && !readOnly && (
                            <div className="px-3 py-1.5 flex flex-wrap items-center gap-2 shrink-0" style={{ backgroundColor: '#E8EEF7', borderBottom: '1px solid #000080' }}>
                                <span className="text-[11px] font-bold" style={{ color: '#000080' }}>Table Tools:</span>
                                <div className="flex items-center gap-1">
                                    <span className="text-[11px]">Col Width (px):</span>
                                    <input type="number" min="30" max="800" value={cellWidthPx} onChange={(e) => applyColumnWidth(e.target.value)} className="win-input w-16 text-center" style={{ padding: '2px 4px', fontSize: '11px' }} />
                                </div>
                                <div className="flex items-center gap-1">
                                    <span className="text-[11px]">Row Height (px):</span>
                                    <input type="number" min="20" max="600" value={rowHeightPx} onChange={(e) => applyRowHeight(e.target.value)} className="win-input w-16 text-center" style={{ padding: '2px 4px', fontSize: '11px' }} />
                                </div>
                                <div className="win-separator" />

                                <button type="button" className="win-btn" onClick={() => modifyTableStructure('addRowBelow')}>+Row Below</button>
                                <button type="button" className="win-btn" onClick={() => modifyTableStructure('addColLeft')}>+Col Left</button>
                                <button type="button" className="win-btn" onClick={() => modifyTableStructure('addColRight')}>+Col Right</button>
                                <button type="button" className="win-btn" onClick={() => cellBgColorRef.current && cellBgColorRef.current.click()}>Shade Cell</button>
                                <input ref={cellBgColorRef} type="color" className="hidden" defaultValue="#ECE9D8" onChange={(e) => setCellBackground(e.target.value)} />
                                <button type="button" className="win-btn" style={{ color: '#8B0000' }} onClick={() => modifyTableStructure('delRow')}>-Row</button>
                                <button type="button" className="win-btn" style={{ color: '#8B0000' }} onClick={() => modifyTableStructure('delCol')}>-Col</button>
                                <button type="button" className="win-btn" style={{ color: '#8B0000' }} onClick={() => modifyTableStructure('delTable')}>Del Table</button>
                            </div>
                        )}

                        <div className="flex-1 flex overflow-hidden">
                            {!focusMode && showTOC && (
                                <aside className="w-56 shrink-0 flex flex-col win-raised overflow-hidden">
                                    <div className="win-titlebar px-2 py-1 flex items-center justify-between text-[11px] font-bold">
                                        <span>Document Map</span>
                                        <button type="button" className="win-btn" style={{ padding: '0px 5px', fontSize: '10px' }} onClick={() => setShowTOC(false)}>X</button>

                                    <div className="flex-1 overflow-y-auto p-2">
                                        <div className="win-sunken min-h-full p-2 space-y-1">
                                            {documentHeadings.length === 0 ? (
                                                <div className="text-[11px] italic" style={{ color: '#666666' }}>Add Heading 1 or Heading 2 paragraphs to populate the Document Map.</div>

                                                documentHeadings.map(h => (
                                                    <button key={h.id} type="button" onClick={() => scrollToHeading(h.elem)} className="w-full text-left px-1.5 py-1 text-[11px] hover:bg-[#000080] hover:text-white truncate cursor-pointer block" style={{ paddingLeft: `${(h.level - 1) * 10 + 6}px` }}>
                                                        {h.text}
                                                    </button>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </aside>
                            )}

                            <div ref={scrollRef} className="flex-1 overflow-auto doc-workspace p-4 sm:p-8 text-center">
                                {(() => {
                                    const metrics = getPaperMetrics(advancedSettings.paperMode);
                                    const scale = zoomLevel / 100;
                                    const totalPaperHeight = metrics.paged ? pageCount * metrics.height : undefined;
                                    return (
                                        <div style={{
                                            display: 'inline-block',
                                            width: `${Math.round(metrics.width * scale)}px`,
                                            height: totalPaperHeight ? `${Math.round(totalPaperHeight * scale)}px` : 'auto',
                                            textAlign: 'left',
                                            marginBottom: '64px'
                                        }}>
                                            <div
                                                ref={paperRef}
                                                id="printable-paper"
                                                className={`doc-paper relative ${getPaperClass(advancedSettings.paperMode)}`}
                                                style={{
                                                    width: `${metrics.width}px`,
                                                    minHeight: totalPaperHeight ? `${totalPaperHeight}px` : undefined,
                                                    backgroundColor: getPageBgColor(advancedSettings.pageTint),
                                                    padding: getMarginPx(advancedSettings.pageMargins),
                                                    transform: `scale(${scale})`,
                                                    transformOrigin: 'top left'
                                                }}
                                            >
                                                {/* Full-Page Boundary Indicators (Page 1, Page 2, etc.) */}

                                                    <div
                                                        key={`pg_break_${idx}`}
                                                        className="page-break-band no-print-overlay"
                                                        style={{ top: `${(idx + 1) * metrics.height}px` }}
                                                    >
                                                        <span className="page-break-label">
                                                            End of Page {idx + 1} &bull; Start of Page {idx + 2}
                                                        </span>
                                                    </div>

                                                        value={imgEditState.widthPx}
                                                        onChange={e => {
                                                            const w = Math.max(40, Math.min(800, parseInt(e.target.value, 10) || 40));
                                                            setImgEditState(s => ({
                                                                ...s,
                                                                widthPx: w,
                                                                heightPx: s.lockAspect ? Math.round(w / (s.aspectRatio || 1)) : s.heightPx
                                                            }));
                                                        }}
                                                        className="win-input w-full"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold mb-0.5">Height (px):</label>
                                                    <input
                                                        type="number" min="40" max="800"
                                                        value={imgEditState.heightPx}
                                                        disabled={imgEditState.lockAspect}
                                                        onChange={e => setImgEditState(s => ({ ...s, heightPx: Math.max(40, Math.min(800, parseInt(e.target.value, 10) || 40)) }))}
                                                        className="win-input w-full"
                                                    />
                                                </div>
                                            </div>
                                            <label className="flex items-center gap-1.5 text-[11px] cursor-pointer">
                                                <input type="checkbox" checked={imgEditState.lockAspect} onChange={e => setImgEditState(s => ({ ...s, lockAspect: e.target.checked }))} />
                                                <span>Lock Aspect Ratio</span>
                                            </label>
                                        </fieldset>

                                        <fieldset className="win-fieldset space-y-2">
                                            <legend>Text Wrapping &amp; Layout Flow</legend>
                                            <div className="grid grid-cols-2 gap-1">
                                                {[
                                                    { id: 'inline', label: 'In Line with Text' },
                                                    { id: 'center', label: 'Break Text (Center)' },
                                                    { id: 'left', label: 'Wrap Left (Float)' },
                                                    { id: 'right', label: 'Wrap Right (Float)' }
                                                ].map(al => (
                                                    <button key={al.id} type="button" className={`win-btn ${imgEditState.align === al.id ? 'win-btn-primary' : ''}`} style={{ padding: '2px 4px', fontSize: '10px' }} onClick={() => setImgEditState(s => ({ ...s, align: al.id }))}>{al.label}</button>
                                                ))}
                                            </div>
                                        </fieldset>

                                        <fieldset className="win-fieldset space-y-1.5">
                                            <legend>Color &amp; Tone Filters</legend>
                                            <div className="grid grid-cols-2 gap-2 text-[10px]">
                                                <label className="flex flex-col">
                                                    <span>Brightness: {imgEditState.brightness}%</span>
                                                    <input type="range" min="40" max="180" value={imgEditState.brightness} onChange={e => setImgEditState(s => ({ ...s, brightness: Number(e.target.value) }))} />
                                                </label>
                                                <label className="flex flex-col">
                                                    <span>Contrast: {imgEditState.contrast}%</span>
                                                    <input type="range" min="40" max="180" value={imgEditState.contrast} onChange={e => setImgEditState(s => ({ ...s, contrast: Number(e.target.value) }))} />
                                                </label>
                                                <label className="flex flex-col">
                                                    <span>Grayscale: {imgEditState.grayscale}%</span>
                                                    <input type="range" min="0" max="100" value={imgEditState.grayscale} onChange={e => setImgEditState(s => ({ ...s, grayscale: Number(e.target.value) }))} />
                                                </label>
                                                <label className="flex flex-col">
                                                    <span>Sepia: {imgEditState.sepia}%</span>
                                                    <input type="range" min="0" max="100" value={imgEditState.sepia} onChange={e => setImgEditState(s => ({ ...s, sepia: Number(e.target.value) }))} />
                                                </label>
                                            </div>
                                        </fieldset>

                                        <fieldset className="win-fieldset space-y-2">
                                            <legend>Frame &amp; Alt Text</legend>
                                            <div className="grid grid-cols-4 gap-1">
                                                {[{ id: 'none', label: 'None' }, { id: 'thin', label: 'Thin' }, { id: 'bevel', label: '3D Bevel' }, { id: 'shadow', label: 'Shadow' }].map(b => (
                                                    <button key={b.id} type="button" className={`win-btn ${imgEditState.borderStyle === b.id ? 'win-btn-primary' : ''}`} style={{ padding: '2px 4px', fontSize: '10px' }} onClick={() => setImgEditState(s => ({ ...s, borderStyle: b.id }))}>{b.label}</button>
                                                ))}
                                            </div>
                                            <input type="text" value={imgEditState.alt} onChange={e => setImgEditState(s => ({ ...s, alt: e.target.value }))} placeholder="Image caption / alt text..." className="win-input w-full" />
                                        </fieldset>
                                    </div>
                                </div>
                                <div className="px-4 py-2.5 flex items-center justify-between gap-2" style={{ borderTop: '1px solid #808080' }}>
                                    <button type="button" className="win-btn" onClick={() => setImgEditState(s => ({ ...s, rotation: 0, flipH: false, flipV: false, brightness: 100, contrast: 100, grayscale: 0, sepia: 0, borderStyle: 'none' }))}>Reset Filters</button>
                                    <div className="flex items-center gap-2">
                                        <button type="button" className="win-btn" onClick={() => setShowImageEditor(false)}>Cancel</button>
                                        <button type="button" className="win-btn win-btn-primary" onClick={applyImageEditorChanges}>Apply Changes</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Insert Hyperlink Dialog */}
                    {showLinkDialog && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }} onClick={() => setShowLinkDialog(false)}>
                            <form onSubmit={handleInsertLinkSubmit} className="win-raised w-full max-w-md" style={{ boxShadow: '5px 5px 0 rgba(0,0,0,0.45)' }} onClick={e => e.stopPropagation()}>
                                <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between text-xs font-bold">
                                    <span>Insert Hyperlink</span>
                                    <button type="button" className="win-btn" style={{ padding: '0 5px', fontSize: '10px' }} onClick={() => setShowLinkDialog(false)}>X</button>
                                </div>
                                <div className="p-4 space-y-3">
                                    <div>
                                        <label className="block text-[11px] font-bold mb-1">Display Text:</label>
                                        <input type="text" value={linkTextInput} onChange={e => setLinkTextInput(e.target.value)} placeholder="Click here..." className="win-input w-full" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold mb-1">Web Address (URL):</label>
                                        <input type="url" required autoFocus value={linkUrlInput} onChange={e => setLinkUrlInput(e.target.value)} placeholder="https://..." className="win-input w-full" />
                                    </div>
                                    <div className="flex justify-end gap-2">
                                        <button type="button" className="win-btn" onClick={() => setShowLinkDialog(false)}>Cancel</button>
                                        <button type="submit" className="win-btn win-btn-primary">Insert Link</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Document Templates Picker Dialog */}
                    {showTemplateDialog && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }} onClick={() => setShowTemplateDialog(false)}>
                            <div className="win-raised w-full max-w-lg" style={{ boxShadow: '6px 6px 0 rgba(0,0,0,0.5)' }} onClick={e => e.stopPropagation()}>
                                <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between text-xs font-bold">
                                    <span>New Document — Choose a Template</span>
                                    <button type="button" className="win-btn" style={{ padding: '0 5px', fontSize: '10px' }} onClick={() => setShowTemplateDialog(false)}>X</button>
                                </div>
                                <div className="p-4 space-y-2.5">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                        {DOC_TEMPLATES.map(tpl => (
                                            <button key={tpl.id} type="button" onClick={() => createNewDocument(tpl)} className="win-raised p-3 text-left hover:bg-[#ECE9D8] cursor-pointer space-y-1">
                                                <div className="flex items-center gap-2 font-bold text-xs" style={{ color: '#000080' }}>
                                                    <RetroDocsIcon size={16} />
                                                    <span>{tpl.name}</span>
                                                </div>
                                                <div className="text-[11px]" style={{ color: '#333333' }}>{tpl.desc}</div>
                                            </button>
                                        ))}
                                    </div>
                                    <div className="flex justify-end pt-2">
                                        <button type="button" className="win-btn" onClick={() => setShowTemplateDialog(false)}>Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Detailed Document Statistics Dialog */}
                    {showStatsDialog && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }} onClick={() => setShowStatsDialog(false)}>
                            <div className="win-raised w-full max-w-xs" style={{ boxShadow: '5px 5px 0 rgba(0,0,0,0.45)' }} onClick={e => e.stopPropagation()}>
                                <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between text-xs font-bold">
                                    <span>Document Statistics</span>
                                    <button type="button" className="win-btn" style={{ padding: '0 5px', fontSize: '10px' }} onClick={() => setShowStatsDialog(false)}>X</button>
                                </div>
                                <div className="p-4 space-y-2 text-xs">
                                    <div className="win-sunken p-2.5 space-y-1.5">
                                        <div className="flex justify-between"><span>Words:</span><b>{wordCount}</b></div>
                                        <div className="flex justify-between"><span>Characters (with spaces):</span><b>{charCount}</b></div>
                                        <div className="flex justify-between"><span>Estimated Pages:</span><b>{Math.max(1, Math.ceil(wordCount / 300))}</b></div>
                                        <div className="flex justify-between"><span>Reading Time:</span><b>{Math.max(1, Math.ceil(wordCount / 200))} min</b></div>
                                        <div className="flex justify-between"><span>Readability:</span><b>{readability}</b></div>
                                        <div className="flex justify-between"><span>Headings:</span><b>{documentHeadings.length}</b></div>
                                        <div className="flex justify-between"><span>Sticky Notes:</span><b>{(currentDoc?.comments || []).length}</b></div>
                                    </div>
                                    <div className="flex justify-end pt-1">
                                        <button type="button" className="win-btn win-btn-primary" onClick={() => setShowStatsDialog(false)}>OK</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Version History Snapshots Dialog */}
                    {showHistoryDialog && currentDoc && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }} onClick={() => setShowHistoryDialog(false)}>
                            <div className="win-raised w-full max-w-md" style={{ boxShadow: '6px 6px 0 rgba(0,0,0,0.5)' }} onClick={e => e.stopPropagation()}>
                                <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between text-xs font-bold">
                                    <span>Version History — {currentDoc.title}</span>
                                    <button type="button" className="win-btn" style={{ padding: '0 5px', fontSize: '10px' }} onClick={() => setShowHistoryDialog(false)}>X</button>
                                </div>
                                <div className="p-4 space-y-3">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[11px]">Saved snapshots for this document:</span>
                                        <button type="button" className="win-btn win-btn-primary" onClick={saveVersionSnapshot}>+ Save Snapshot Now</button>
                                    </div>
                                    <div className="win-sunken p-2 max-h-60 overflow-y-auto space-y-1.5">
                                        {(!currentDoc.snapshots || currentDoc.snapshots.length === 0) ? (
                                            <div className="py-8 text-center text-[11px]" style={{ color: '#666666' }}>No snapshots saved yet.</div>
                                        ) : (
                                            currentDoc.snapshots.map(snap => (
                                                <div key={snap.id} className="flex items-center justify-between gap-2 p-2 border border-[#CCCCCC] bg-[#F8F8F4]">
                                                    <div>
                                                        <div className="text-[11px] font-bold">{new Date(snap.timestamp).toLocaleString()}</div>
                                                        <div className="text-[10px]" style={{ color: '#555555' }}>{snap.wordCount} words</div>
                                                    </div>
                                                    <button type="button" className="win-btn" onClick={() => restoreSnapshot(snap)}>Restore</button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                    <div className="flex justify-end">
                                        <button type="button" className="win-btn" onClick={() => setShowHistoryDialog(false)}>Close</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Insert Table Dialog */}
                    {showTableDialog && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }} onClick={() => setShowTableDialog(false)}>
                            <form onSubmit={handleInsertTableSubmit} className="win-raised w-full max-w-xs" style={{ boxShadow: '5px 5px 0 rgba(0,0,0,0.45)' }} onClick={e => e.stopPropagation()}>
                                <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between text-xs font-bold">
                                    <span>Insert Table</span>
                                    <button type="button" className="win-btn" style={{ padding: '0 5px', fontSize: '10px' }} onClick={() => setShowTableDialog(false)}>X</button>
                                </div>
                                <div className="p-4 space-y-3">
                                    <div className="flex items-center justify-between gap-2">
                                        <label className="text-xs font-bold">Number of rows:</label>
                                        <input type="number" min="1" max="20" value={tableRows} onChange={e => setTableRows(e.target.value)} className="win-input w-20 text-center" />
                                    </div>
                                    <div className="flex items-center justify-between gap-2">
                                        <label className="text-xs font-bold">Number of columns:</label>
                                        <input type="number" min="1" max="12" value={tableCols} onChange={e => setTableCols(e.target.value)} className="win-input w-20 text-center" />
                                    </div>
                                    <div className="flex justify-end gap-2 pt-1">
                                        <button type="button" className="win-btn" onClick={() => setShowTableDialog(false)}>Cancel</button>
                                        <button type="submit" className="win-btn win-btn-primary">OK</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Find & Replace Dialog */}
                    {showFindReplace && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.45)' }} onClick={() => setShowFindReplace(false)}>
                            <form onSubmit={handleFindReplaceSubmit} className="win-raised w-full max-w-md" style={{ boxShadow: '5px 5px 0 rgba(0,0,0,0.45)' }} onClick={e => e.stopPropagation()}>
                                <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between text-xs font-bold">
                                    <span>Find and Replace</span>
                                    <button type="button" className="win-btn" style={{ padding: '0 5px', fontSize: '10px' }} onClick={() => setShowFindReplace(false)}>X</button>
                                </div>
                                <div className="p-4 space-y-3">
                                    <div>
                                        <label className="block text-[11px] font-bold mb-1">Find what:</label>
                                        <input type="text" required autoFocus value={findText} onChange={e => setFindText(e.target.value)} className="win-input w-full" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold mb-1">Replace with:</label>
                                        <input type="text" value={replaceText} onChange={e => setReplaceText(e.target.value)} className="win-input w-full" />
                                    </div>
                                    <div className="flex justify-end gap-2 pt-1">
                                        <button type="button" className="win-btn" onClick={() => setShowFindReplace(false)}>Cancel</button>
                                        <button type="submit" className="win-btn win-btn-primary">Replace All</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Word Goal Dialog */}
                    {showGoalDialog && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.45)' }} onClick={() => setShowGoalDialog(false)}>
                            <form
                                onSubmit={(e) => {
                                    e.preventDefault();
                                    const num = Math.max(0, parseInt(goalInput, 10) || 0);
                                    setWordGoal(num);
                                    setShowGoalDialog(false);
                                    notify(num > 0 ? `Word goal set to ${num} words.` : 'Word goal disabled.');
                                }}
                                className="win-raised w-full max-w-xs"
                                style={{ boxShadow: '5px 5px 0 rgba(0,0,0,0.45)' }}
                                onClick={e => e.stopPropagation()}
                            >
                                <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between text-xs font-bold">
                                    <span>Set Word Count Goal</span>
                                    <button type="button" className="win-btn" style={{ padding: '0 5px', fontSize: '10px' }} onClick={() => setShowGoalDialog(false)}>X</button>
                                </div>
                                <div className="p-4 space-y-3">
                                    <label className="block text-[11px] font-bold">Target Word Count (0 to disable):</label>
                                    <input type="number" min="0" value={goalInput} onChange={e => setGoalInput(e.target.value)} className="win-input w-full" autoFocus />
                                    <div className="flex justify-end gap-2">
                                        <button type="button" className="win-btn" onClick={() => setShowGoalDialog(false)}>Cancel</button>
                                        <button type="submit" className="win-btn win-btn-primary">OK</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Keyboard Shortcuts Reference Dialog */}
                    {showShortcutsDialog && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }} onClick={() => setShowShortcutsDialog(false)}>
                            <div className="win-raised w-full max-w-sm" style={{ boxShadow: '5px 5px 0 rgba(0,0,0,0.45)' }} onClick={e => e.stopPropagation()}>
                                <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between text-xs font-bold">
                                    <span>Keyboard Shortcuts</span>
                                    <button type="button" className="win-btn" style={{ padding: '0 5px', fontSize: '10px' }} onClick={() => setShowShortcutsDialog(false)}>X</button>
                                </div>
                                <div className="p-4 space-y-2 text-xs">
                                    <div className="win-sunken p-2.5 space-y-1.5">
                                        <div className="flex justify-between"><span>Save &amp; Sync Now</span><b>Ctrl + S</b></div>
                                        <div className="flex justify-between"><span>Find &amp; Replace</span><b>Ctrl + F</b></div>
                                        <div className="flex justify-between"><span>Bold / Italic / Underline</span><b>Ctrl + B / I / U</b></div>
                                        <div className="flex justify-between"><span>Paste Image from Clipboard</span><b>Ctrl + V</b></div>
                                        <div className="flex justify-between"><span>Heading 1 / Heading 2</span><b># + Space / ## + Space</b></div>
                                        <div className="flex justify-between"><span>Bullet / Numbered List</span><b>- + Space / 1. + Space</b></div>
                                        <div className="flex justify-between"><span>Exit Focus Mode</span><b>Esc</b></div>
                                    </div>
                                    <div className="flex justify-end pt-1">
                                        <button type="button" className="win-btn win-btn-primary" onClick={() => setShowShortcutsDialog(false)}>OK</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* About Dialog */}
                    {showAboutDialog && (
                        <div className="fixed inset-0 z-[600] flex items-center justify-center p-4" style={{ backgroundColor: 'rgba(0,0,0,0.5)' }} onClick={() => setShowAboutDialog(false)}>
                            <div className="win-raised w-full max-w-sm" style={{ boxShadow: '5px 5px 0 rgba(0,0,0,0.45)' }} onClick={e => e.stopPropagation()}>
                                <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between text-xs font-bold">
                                    <span>About HL Docs 4</span>
                                    <button type="button" className="win-btn" style={{ padding: '0 5px', fontSize: '10px' }} onClick={() => setShowAboutDialog(false)}>X</button>
                                </div>
                                <div className="p-4 space-y-3">
                                    <div className="flex items-center gap-3 pb-3 border-b border-[#808080]">
                                        <RetroDocsIcon size={40} />
                                        <div>
                                            <div className="font-bold text-sm" style={{ color: '#000080' }}>HL Docs 4</div>
                                            <div className="text-[11px]">Version 4.0</div>
                                            <div className="text-[10px]" style={{ color: '#404040' }}>Classic 2000s Word Processor</div>
                                        </div>
                                    </div>
                                    <p className="text-[11px] leading-relaxed">
                                        A classic 2000s-styled word processor with 55+ fonts, table sizing tools, built-in Picture Editor with text-reflow drag &amp; resize, full-page layout, sticky notes, templates, MS Word (.doc) export, and optional cloud backup.
                                    </p>
                                    <div className="flex justify-end">
                                        <button type="button" className="win-btn win-btn-primary" onClick={() => setShowAboutDialog(false)}>OK</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );

            return (
                <div className="w-screen h-screen flex flex-col overflow-hidden" onClick={() => setActiveMenu(null)}>
                    {/* Classic 2000s Window Title Bar */}
                    {!focusMode && (
                        <div className="win-titlebar px-2.5 py-1.5 flex items-center justify-between gap-2 shrink-0">
                            <div className="flex items-center gap-2 min-w-0">
                                <RetroDocsIcon size={16} />
                                <span className="text-xs font-bold tracking-wide truncate">
                                    {currentView === 'editor' && currentDoc
                                        ? `${currentDoc.title || 'Untitled Document'} - HL Docs 4`
                                        : 'My Documents - HL Docs 4'}
                                </span>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                                <button
                                    type="button"
                                    className="win-btn"
                                    style={{ padding: '0px 6px', fontSize: '10px', lineHeight: '15px' }}
                                    onClick={() => setCurrentView(currentView === 'editor' ? 'home' : 'editor')}
                                    title={currentView === 'editor' ? 'Return to My Documents' : 'Return to Editor'}
                                >
                                    {currentView === 'editor' ? 'Docs' : 'Edit'}
                                </button>
                                {authSession ? (
                                    <React.Fragment>
                                        <span className="hidden sm:inline px-2 py-0.5 text-[10px] font-bold" style={{ backgroundColor: '#000040', border: '1px solid rgba(255,255,255,0.3)' }}>
                                            {authSession.displayName || authSession.username}
                                        </span>
                                        <button
                                            type="button"
                                            className="win-btn"
                                            style={{ padding: '0px 6px', fontSize: '10px', lineHeight: '15px' }}
                                            onClick={() => { pushDirtyDocsToCloud(false); notify('Cloud backup triggered.'); }}
                                            title="Back Up Pending Changes Now"
                                        >
                                            Sync
                                        </button>
                                        <button
                                            type="button"
                                            className="win-btn"
                                            style={{ padding: '0px 6px', fontSize: '10px', lineHeight: '15px', color: '#8B0000' }}
                                            onClick={handleSignOut}
                                            title="Sign Out"
                                        >
                                            Sign Out
                                        </button>
                                    </React.Fragment>
                                ) : (
                                    <button
                                        type="button"
                                        className="win-btn"
                                        style={{ padding: '0px 8px', fontSize: '10px', lineHeight: '15px', color: '#000080' }}
                                        onClick={() => { setAuthError(''); setShowAuthModal(true); }}
                                        title="Sign In for Cloud Backup"
                                    >
                                        Sign In
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Classic Menu Bar */}
                    {!focusMode && renderMenuBar()}

                    {/* Active View */}
                    {currentView === 'home' ? renderHomeView() : renderEditorView()}

                    {/* Floating Windows & Modals */}
                    {renderAuthModal()}
                    {renderCalculatorWindow()}
                    {renderSettingsDialog()}
                    {renderClassicDialogs()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
