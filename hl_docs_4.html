    <style>
        /* =========================================================
           CLASSIC 2000s WINDOWS / OFFICE DESIGN SYSTEM
           ========================================================= */
        :root {
            --win-bg: #D4D0C8;
            --win-surface: #ECE9D8;
            --win-light: #FFFFFF;
            --win-shadow: #808080;
            --win-dark: #404040;
            --win-navy: #000080;
            --win-blue: #1084D0;
            --win-desktop: #3A6EA5;
            --win-workspace: #808080;
            --win-text: #000000;
        }

        * { box-sizing: border-box; }

        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Tahoma, Verdana, Arial, sans-serif;
            font-size: 12px;
            color: var(--win-text);
            background-color: var(--win-bg);
            -webkit-font-smoothing: auto;
        }

        /* Classic 3D Bevel Utilities */
        .win-raised {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-dark);
            border-bottom: 2px solid var(--win-dark);
        }

        .win-raised-sm {
            background-color: var(--win-surface);
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid var(--win-dark);
            border-bottom: 1px solid var(--win-dark);
        }

        .win-sunken {
            background-color: #FFFFFF;
            border-top: 2px solid var(--win-shadow);
            border-left: 2px solid var(--win-shadow);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
        }

        .win-sunken-gray {
            background-color: var(--win-bg);
            border-top: 1px solid var(--win-shadow);
            border-left: 1px solid var(--win-shadow);
            border-right: 1px solid var(--win-light);
            border-bottom: 1px solid var(--win-light);
        }

        .win-titlebar {
            background: linear-gradient(90deg, #000080 0%, #1084D0 100%);
            color: #FFFFFF;
            user-select: none;
        }

        .win-btn {
            background-color: var(--win-surface);
            color: #000000;
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-dark);
            border-bottom: 2px solid var(--win-dark);
            font-family: Tahoma, Verdana, Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            user-select: none;
            line-height: 1.2;
        }

        .win-btn:hover:not(:disabled) { background-color: #F4F2E8; }

        .win-btn:active:not(:disabled),
        .win-btn.active {
            border-top: 2px solid var(--win-dark);
            border-left: 2px solid var(--win-dark);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            background-color: #C8C4BC;
            padding-top: 4px;
            padding-bottom: 2px;
        }

        .win-btn:disabled {
            color: #808080;
            cursor: not-allowed;
        }

        .win-btn-primary {
            background-color: #000080;
            color: #FFFFFF;
            border-top: 2px solid #5B7FD6;
            border-left: 2px solid #5B7FD6;
            border-right: 2px solid #000033;
            border-bottom: 2px solid #000033;
        }

        .win-btn-primary:hover:not(:disabled) { background-color: #0A1E9C; }

        .win-btn-primary:active:not(:disabled) {
            border-top: 2px solid #000033;
            border-left: 2px solid #000033;
            border-right: 2px solid #5B7FD6;
            border-bottom: 2px solid #5B7FD6;
            background-color: #000066;
        }

        .win-tool-btn {
            background-color: transparent;
            color: #000000;
            border: 1px solid transparent;
            padding: 3px 6px;
            min-width: 26px;
            min-height: 26px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            user-select: none;
        }

        .win-tool-btn:hover:not(:disabled) {
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid var(--win-shadow);
            border-bottom: 1px solid var(--win-shadow);
            background-color: #ECE9D8;
        }

        .win-tool-btn:active:not(:disabled),
        .win-tool-btn.active {
            border-top: 1px solid var(--win-shadow);
            border-left: 1px solid var(--win-shadow);
            border-right: 1px solid var(--win-light);
            border-bottom: 1px solid var(--win-light);
            background-color: #C5C1B9;
        }

        .win-tool-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .win-menu-item {
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            color: #000000;
            user-select: none;
        }

        .win-menu-item:hover,
        .win-menu-item.open {
            background-color: #000080;
            color: #FFFFFF;
        }

        .win-dropdown {
            background-color: var(--win-bg);
            border-top: 2px solid var(--win-light);
            border-left: 2px solid var(--win-light);
            border-right: 2px solid var(--win-dark);
            border-bottom: 2px solid var(--win-dark);
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.35);
            z-index: 250;
        }

        .win-dropdown-item {
            width: 100%;
            text-align: left;
            padding: 5px 14px;
            font-size: 11px;
            color: #000000;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .win-dropdown-item:hover {
            background-color: #000080;
            color: #FFFFFF;
        }

        .win-fieldset {
            border: 1px solid var(--win-shadow);
            box-shadow: inset 1px 1px 0 var(--win-light);
            background-color: var(--win-bg);
            padding: 10px 12px 12px 12px;
        }

        .win-fieldset legend {
            color: #000080;
            font-weight: 700;
            font-size: 11px;
            padding: 0 5px;
        }

        .win-input, .win-select {
            background-color: #FFFFFF;
            color: #000000;
            border-top: 2px solid var(--win-shadow);
            border-left: 2px solid var(--win-shadow);
            border-right: 2px solid var(--win-light);
            border-bottom: 2px solid var(--win-light);
            font-family: Tahoma, Verdana, Arial, sans-serif;
            font-size: 12px;
            padding: 4px 7px;
            outline: none;
        }

        .win-select {
            padding: 2px 5px;
            font-size: 11px;
        }

        .win-separator {
            width: 2px;
            height: 20px;
            border-left: 1px solid var(--win-shadow);
            border-right: 1px solid var(--win-light);
            margin: 0 4px;
            flex-shrink: 0;
        }

        .win-tab {
            background-color: #C0BCB4;
            color: #000000;
            font-size: 11px;
            font-weight: 400;
            padding: 4px 12px;
            border-top: 2px solid #FFFFFF;
            border-left: 2px solid #FFFFFF;
            border-right: 2px solid #404040;
            border-bottom: 1px solid #808080;
            cursor: pointer;
        }

        .win-tab.active {
            background-color: #D4D0C8;
            font-weight: 700;
            padding: 5px 14px 6px 14px;
            margin-bottom: -1px;
            border-bottom: 1px solid #D4D0C8;
        }

        /* Document Canvas & Page Simulations */
        .doc-workspace {
            background-color: #808080;
            background-image: radial-gradient(#737373 1px, transparent 0);
            background-size: 16px 16px;
        }

        .doc-paper {
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.45);
            border: 1px solid #000000;
        }

        .page-simulation-a4 {
            width: 794px;
            min-height: 1123px;
            background-image: linear-gradient(to bottom, transparent 1121px, #999999 1121px, #999999 1123px, transparent 1123px);
            background-size: 100% 1123px;
        }

        .page-simulation-letter {
            width: 816px;
            min-height: 1056px;
            background-image: linear-gradient(to bottom, transparent 1054px, #999999 1054px, #999999 1056px, transparent 1056px);
            background-size: 100% 1056px;
        }

        .page-simulation-a5 {
            width: 559px;
            min-height: 794px;
            background-image: linear-gradient(to bottom, transparent 792px, #999999 792px, #999999 794px, transparent 794px);
            background-size: 100% 794px;
        }

        .page-simulation-wide {
            width: 980px;
            min-height: 620px;
        }

        .page-simulation-infinite {
            width: 100%;
            max-width: 820px;
            min-height: calc(100vh - 220px);
        }

        /* Rich Text Editor Typography */
        .editor-content {
            outline: none;
            word-break: break-word;
            color: #000000;
        }

        .editor-content::after {
            content: "";
            display: table;
            clear: both;
        }

        .editor-content h1 {
            font-size: 2em;
            font-weight: 700;
            margin: 0.5em 0 0.35em 0;
            border-bottom: 1px solid #CCCCCC;
            padding-bottom: 4px;
        }

        .editor-content h2 {
            font-size: 1.5em;
            font-weight: 700;
            margin: 0.6em 0 0.3em 0;
        }

        .editor-content h3 {
            font-size: 1.2em;
            font-weight: 700;
            margin: 0.5em 0 0.25em 0;
        }

        .editor-content ul { list-style-type: disc; padding-left: 2rem; margin: 0.5rem 0; }
        .editor-content ol { list-style-type: decimal; padding-left: 2rem; margin: 0.5rem 0; }

        .editor-content blockquote {
            border-left: 4px solid #000080;
            background: #F4F4F0;
            padding: 8px 14px;
            margin: 12px 0;
            font-style: italic;
            color: #333333;
        }

        .editor-content pre {
            background: #F0F0EC;
            border: 1px solid #B0B0B0;
            padding: 10px 12px;
            font-family: "Courier New", monospace;
            font-size: 12px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .editor-content table.doc-table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            table-layout: fixed;
        }

        .editor-content table.doc-table td {
            border: 1px solid #404040;
            padding: 6px 8px;
            min-width: 30px;
            vertical-align: top;
        }

        .editor-content table.doc-table td.selected-cell {
            outline: 2px solid #000080;
            outline-offset: -2px;
        }

        .editor-content a {
            color: #0000EE;
            text-decoration: underline;
            cursor: pointer;
        }

        .editor-content img {
            max-width: 100%;
            height: auto;
            cursor: grab;
        }

        .editor-content img:active {
            cursor: grabbing;
        }

        .editor-content img.selected-img {
            outline: 2px dashed #000080;
            outline-offset: 2px;
        }

        .img-resize-handle {
            position: absolute;
            width: 11px;
            height: 11px;
            background-color: #000080;
            border: 1px solid #FFFFFF;
            cursor: nwse-resize;
            z-index: 60;
            box-shadow: 1px 1px 0px #000000;
        }

        .page-break-band {
            position: absolute;
            left: 0;
            right: 0;
            height: 16px;
            margin-top: -8px;
            background-color: #808080;
            border-top: 1px solid #000000;
            border-bottom: 1px solid #000000;
            pointer-events: none;
            z-index: 25;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-break-label {
            background-color: #D4D0C8;
            border: 1px solid #404040;
            color: #000080;
            font-size: 9px;
            font-weight: 700;
            padding: 0 8px;
            line-height: 13px;
        }

        .editor-content hr {
            border: 0;
            border-top: 2px groove #CCCCCC;
            margin: 18px 0;
        }

        /* Retro Sticky Note Card */
        .sticky-note {
            background-color: #FFFFCC;
            border: 1px solid #C8B848;
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.2);
        }

        /* Classic Windows Scrollbar */
        ::-webkit-scrollbar { width: 16px; height: 16px; }
        ::-webkit-scrollbar-track {
            background: repeating-conic-gradient(#D4D0C8 0% 25%, #ECE9D8 0% 50%) 50% / 4px 4px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #D4D0C8;
            border-top: 2px solid #FFFFFF;
            border-left: 2px solid #FFFFFF;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
        }
        ::-webkit-scrollbar-thumb:hover { background-color: #DCD8D0; }

        /* Classic Ruler Strip */
        .classic-ruler {
            height: 22px;
            background: #FFFFFF;
            border-bottom: 1px solid #808080;
            background-image: repeating-linear-gradient(
                to right,
                #808080 0px,
                #808080 1px,
                transparent 1px,
                transparent 12px
            );
            position: relative;
        }

        /* Print Stylesheet */
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm;
            }
            html, body, #root {
                height: auto !important;
                overflow: visible !important;
                background: #FFFFFF !important;
            }
            body * { visibility: hidden; }
            #printable-paper, #printable-paper * { visibility: visible; }
            .no-print-overlay { display: none !important; visibility: hidden !important; }
            #printable-paper {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                transform: none !important;
                background-image: none !important;
            }
        }
    </style>
</head>

            return new Promise((resolve) => {
                try {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width;
                        let h = img.height;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
                            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => resolve(dataUrl);
                    img.src = dataUrl;
                } catch (e) {

                if (!onlineRef.current) {

                const trashList = trashRef.current;

                    ? [
                        ...allDocs.map(d => ({ ...d, trashed: false })),
                        ...trashList.map(d => ({ ...d, trashed: true }))
                      ]
                    : [
                        ...allDocs.filter(d => dirtyMap[d.id]).map(d => ({ ...d, trashed: false })),
                        ...trashList.filter(d => dirtyMap[d.id]).map(d => ({ ...d, trashed: true }))
                      ];

                if (docsToSync.length === 0) return;

                setSyncStatus('syncing');
                setSyncErrorMsg('');

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },

                            action: 'sync_docs',

                            username: session.username,

                    const res = await fetch(url, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'load_docs',
                            token: sessionObj.token,
                            username: sessionObj.username
                        })

                        const uKey = sessionObj.username.toLowerCase();

                        const tKey = `hl8006_docs_2000_trash_${uKey}`;
                        const localDocs = safeStorageGet(dKey, []);
                        const localMap = {};
                        localDocs.forEach(d => { if (d && d.id) localMap[d.id] = d; });

                        const mergedActive = [];
                        const mergedTrash = [];
                        const seenIds = new Set();

                        json.documents.forEach(cloudDoc => {
                            if (!cloudDoc || !cloudDoc.id) return;
                            seenIds.add(cloudDoc.id);
                            const localDoc = localMap[cloudDoc.id];
                            const chosen = (localDoc && (localDoc.lastModified || 0) > (cloudDoc.lastModified || 0))
                                ? localDoc
                                : cloudDoc;
                            if (chosen.trashed) mergedTrash.push(chosen);
                            else mergedActive.push(chosen);
                        });

                        const unsyncedLocalIds = [];
                        localDocs.forEach(localDoc => {
                            if (localDoc && localDoc.id && !seenIds.has(localDoc.id)) {
                                mergedActive.push(localDoc);
                                unsyncedLocalIds.push(localDoc.id);
                            }
                        });

                        if (mergedActive.length > 0) {
                            setDocuments(mergedActive);
                            safeStorageSet(dKey, mergedActive);
                        }
                        setDeletedDocuments(mergedTrash);
                        safeStorageSet(tKey, mergedTrash);

                        if (unsyncedLocalIds.length > 0) {
                            const dirtyObj = {};
                            unsyncedLocalIds.forEach(id => { dirtyObj[id] = true; });

                        }
